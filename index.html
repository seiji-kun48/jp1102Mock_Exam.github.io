<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS Cash Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; overscroll-behavior-y: auto; }
    /* สีของธนบัตรและเหรียญ */
    .bg-b1000 { background-color: #94a3b8; color: white; border-bottom: 4px solid #64748b; }
    .bg-b500 { background-color: #a855f7; color: white; border-bottom: 4px solid #7e22ce; }
    .bg-b100 { background-color: #ef4444; color: white; border-bottom: 4px solid #b91c1c; }
    .bg-b50 { background-color: #3b82f6; color: white; border-bottom: 4px solid #1d4ed8; }
    .bg-b20 { background-color: #22c55e; color: white; border-bottom: 4px solid #15803d; }
    .bg-coin { background-color: #fbbf24; color: #78350f; border-bottom: 4px solid #d97706; }
    .btn-press:active { transform: translateY(4px); border-bottom-width: 0px; margin-top: 4px; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const POSCashTracker = () => {
      // --- Global UI State ---
      const [activeTab, setActiveTab] = useState('action');
      const [activePos, setActivePos] = useState('pos1'); 

      // --- Inventories State ---
      const defaultDrawer = { 1000:0, 500:0, 100:0, 50:0, 20:0, 10:0, 5:0, 2:0, 1:0, 0.5:0, 0.25:0 };
      const [pos1, setPos1] = useState({...defaultDrawer});
      const [pos2, setPos2] = useState({...defaultDrawer});
      
      const [tidel, setTidel] = useState({ 
        t1_20: 0, t2_20: 0, t3_20: 0, 
        t4_100: 0, t5_100: 0, t6_100: 0, t7_100: 0, t8_100: 0 
      }); 
      
      const [underMachine, setUnderMachine] = useState(''); 
      const [logs, setLogs] = useState([]);

      const denoms = [1000, 500, 100, 50, 20, 10, 5, 2, 1, 0.5, 0.25];
      const tidelTubesConfig = [
        { id: 't1_20', label: 'ช่อง 1 (แบงก์ 20)', val: 200, denom: 20 },
        { id: 't2_20', label: 'ช่อง 2 (แบงก์ 20)', val: 200, denom: 20 },
        { id: 't3_20', label: 'ช่อง 3 (แบงก์ 20)', val: 200, denom: 20 },
        { id: 't4_100', label: 'ช่อง 4 (แบงก์ 100)', val: 1000, denom: 100 },
        { id: 't5_100', label: 'ช่อง 5 (แบงก์ 100)', val: 1000, denom: 100 },
        { id: 't6_100', label: 'ช่อง 6 (แบงก์ 100)', val: 1000, denom: 100 },
        { id: 't7_100', label: 'ช่อง 7 (แบงก์ 100)', val: 1000, denom: 100 },
        { id: 't8_100', label: 'ช่อง 8 (แบงก์ 100)', val: 1000, denom: 100 }
      ];
      
      const getDenomColor = (val) => {
        if(val === 1000) return 'bg-b1000'; if(val === 500) return 'bg-b500';
        if(val === 100) return 'bg-b100'; if(val === 50) return 'bg-b50';
        if(val === 20) return 'bg-b20'; return 'bg-coin';
      };

      // --- Action Tab State ---
      const [actionMode, setActionMode] = useState('receive'); // receive, change
      const [currentTx, setCurrentTx] = useState({ receive: 0, change: 0 });
      const [currentTxDetails, setCurrentTxDetails] = useState({ receive: {}, change: {} });

      // --- Count Tab (Dropdown States) ---
      const [countSections, setCountSections] = useState({
        pos1: true, pos2: false, tidel: false, under: false
      });
      const toggleCountSection = (sec) => setCountSections(prev => ({ ...prev, [sec]: !prev[sec] }));

      // --- Sync Feature ---
      const fileInputRef = useRef(null);
      const exportData = () => {
        const data = { pos1, pos2, tidel, underMachine, logs };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `POS_Backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        addLog(`☁️ ส่งออกข้อมูล (Export) สำเร็จ`);
      };

      const importData = (event) => {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if(data.pos1) setPos1(data.pos1);
            if(data.pos2) setPos2(data.pos2);
            if(data.tidel) setTidel(data.tidel);
            if(data.underMachine !== undefined) setUnderMachine(data.underMachine);
            if(data.logs) setLogs(data.logs);
            alert('📥 นำเข้าข้อมูลและซิงค์สำเร็จ!');
            addLog(`☁️ นำเข้าข้อมูลซิงค์ (Import) จากไฟล์`);
          } catch(err) {
            alert('ไฟล์ไม่ถูกต้อง');
          }
        };
        reader.readAsText(file);
      };

      // --- Calculations ---
      const calcTotal = (obj) => Object.entries(obj).reduce((sum, [val, qty]) => sum + (parseFloat(val) * (qty||0)), 0);
      const formatCurr = (amt) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0 }).format(amt);
      
      const pos1Total = calcTotal(pos1);
      const pos2Total = calcTotal(pos2);
      
      const tidelTotal = tidelTubesConfig.reduce((sum, tube) => sum + ((tidel[tube.id] || 0) * tube.val), 0);
      const underTotal = parseFloat(underMachine) || 0;
      const grandTotal = pos1Total + pos2Total + tidelTotal + underTotal;

      const addLog = (msg) => {
        setLogs(prev => [{ time: new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit', second:'2-digit'}), msg }, ...prev].slice(0, 50));
      };

      // --- Action Handlers ---
      const handleActionClick = (val) => {
        const updateFn = (prev) => {
          const currentQty = prev[val] || 0;
          if (actionMode === 'receive') return { ...prev, [val]: currentQty + 1 };
          else return { ...prev, [val]: Math.max(0, currentQty - 1) };
        };

        if (activePos === 'pos1') setPos1(updateFn);
        else setPos2(updateFn);

        setCurrentTx(prev => ({
          ...prev,
          receive: actionMode === 'receive' ? prev.receive + val : prev.receive,
          change: actionMode === 'change' ? prev.change + val : prev.change
        }));

        setCurrentTxDetails(prev => ({
          ...prev,
          [actionMode]: { ...prev[actionMode], [val]: (prev[actionMode][val] || 0) + 1 }
        }));
      };

      const cancelTransaction = () => {
        if(currentTx.receive === 0 && currentTx.change === 0) return;
        const revertFn = (prev) => {
           const next = { ...prev };
           Object.entries(currentTxDetails.receive).forEach(([val, qty]) => next[val] = Math.max(0, next[val] - qty));
           Object.entries(currentTxDetails.change).forEach(([val, qty]) => next[val] = next[val] + qty);
           return next;
        };
        if (activePos === 'pos1') setPos1(revertFn);
        else setPos2(revertFn);
        setCurrentTx({ receive: 0, change: 0 });
        setCurrentTxDetails({ receive: {}, change: {} });
      };

      const clearTransaction = () => {
        if(currentTx.receive > 0 || currentTx.change > 0) {
          const rxDet = renderTxDetails(currentTxDetails.receive);
          const chDet = renderTxDetails(currentTxDetails.change);
          addLog(`✅ บิล ${activePos.toUpperCase()}: รับ ฿${currentTx.receive} [${rxDet||'-'}] | ทอน ฿${currentTx.change} [${chDet||'-'}]`);
        }
        setCurrentTx({ receive: 0, change: 0 });
        setCurrentTxDetails({ receive: {}, change: {} });
      };

      const renderTxDetails = (details) => {
         const entries = Object.entries(details).filter(([_, q]) => q > 0);
         if (entries.length === 0) return "";
         return entries.map(([val, q]) => `${val>=1?val:val*100+'ส'}x${q}`).join(', ');
      };

      // --- Exchange State ---
      const [exType, setExType] = useState('tidel_tube'); 
      const [exPos, setExPos] = useState('pos1'); 
      const [exPayDenom, setExPayDenom] = useState(1000);
      const [exPayQty, setExPayQty] = useState('');
      const [exGetTube, setExGetTube] = useState('t1_20');
      const [exGetDenom, setExGetDenom] = useState(20);
      const [exGetQty, setExGetQty] = useState('');
      const [draftAmounts, setDraftAmounts] = useState({ 1000: '', 500: '', 100: '', 50: '', 20: '' });

      const executeExchange = () => {
        // 1. ดราฟเงินลง Tidel
        if(exType === 'draft_tidel') {
           const drawerSetter = exPos === 'pos1' ? setPos1 : setPos2;
           const drawerState = exPos === 'pos1' ? pos1 : pos2;
           let totalDraft = 0; let hasError = false; let draftDetails = [];

           Object.entries(draftAmounts).forEach(([denom, qtyStr]) => {
             const qty = parseInt(qtyStr) || 0;
             if (qty > 0) {
               if (drawerState[denom] < qty) { alert(`แบงก์ ${denom} ในลิ้นชัก ${exPos.toUpperCase()} มีไม่พอ!`); hasError = true; }
               totalDraft += qty * parseInt(denom);
               draftDetails.push(`${denom}x${qty}`);
             }
           });
           if (hasError || totalDraft === 0) return;

           drawerSetter(p => {
             const next = { ...p };
             Object.entries(draftAmounts).forEach(([denom, qtyStr]) => {
               const qty = parseInt(qtyStr) || 0;
               if (qty > 0) next[denom] -= qty;
             });
             return next;
           });

           addLog(`🔽 ดราฟ Tidel จาก ${exPos.toUpperCase()}: รวม ฿${formatCurr(totalDraft)} (${draftDetails.join(', ')})`);
           setDraftAmounts({ 1000: '', 500: '', 100: '', 50: '', 20: '' });
           alert('ดราฟเงินสำเร็จ!'); setActiveTab('count'); return;
        }

        // 2. ดึงเงินทอนสำรอง (ไม่ต้องจ่ายแลก)
        if(exType === 'pull_under') {
           const getQ = parseInt(exGetQty) || 0;
           if(getQ <= 0) return alert('ระบุจำนวนใบ/ชิ้น ที่ต้องการดึง');
           const getValue = exGetDenom * getQ;

           const drawerSetter = exPos === 'pos1' ? setPos1 : setPos2;
           drawerSetter(p => ({ ...p, [exGetDenom]: p[exGetDenom] + getQ }));
           setUnderMachine(p => parseFloat(p||0) - getValue);

           addLog(`📥 ${exPos.toUpperCase()} ดึงสำรองใต้เครื่อง: หยิบ ${exGetDenom}x${getQ} (รวม ฿${formatCurr(getValue)}) เข้าลิ้นชัก`);
           setExGetQty(''); alert('ดึงเงินสำรองสำเร็จ!'); setActiveTab('count'); return;
        }

        // สำหรับแลกเปลี่ยนปกติ (ต้องระบุจำนวน)
        const payQ = parseInt(exPayQty) || 0;
        const getQ = parseInt(exGetQty) || 0;
        if(getQ <= 0) return alert('กรุณาระบุจำนวนที่จะรับ');

        let payValue = exPayDenom * payQ;
        let getValue = exType === 'tidel_tube' ? (tidelTubesConfig.find(t => t.id === exGetTube).val * getQ) : (exGetDenom * getQ);

        if(exType !== 'tidel_tube' || exPos === 'pos2') {
          if(payQ <= 0) return alert('กรุณาระบุจำนวนที่จะจ่ายให้ถูกต้อง');
          if(payValue !== getValue) {
            if(!window.confirm(`ยอดแลกไม่เท่ากัน! คุณจ่าย ฿${payValue} ได้เงิน ฿${getValue} ยืนยันทำรายการไหม?`)) return;
          }
        }

        // 3. แลก Tidel
        if(exType === 'tidel_tube') {
          const tubeConfig = tidelTubesConfig.find(t => t.id === exGetTube);
          const billsInTube = tubeConfig.denom === 100 ? 10 : 10; 
          
          if(tidel[exGetTube] < getQ) return alert('หลอดใน Tidel ที่เลือกมีไม่พอ!');

          if (exPos === 'pos2') {
            if (pos2[exPayDenom] < payQ) return alert('เงินในลิ้นชัก POS 2 ไม่พอจ่าย!');
            setPos2(p => ({ ...p, [exPayDenom]: p[exPayDenom] - payQ }));
            setPos1(p => ({ ...p, [exPayDenom]: p[exPayDenom] + payQ }));
            setTidel(p => ({ ...p, [exGetTube]: Math.max(0, p[exGetTube] - getQ) }));
            setPos2(p => ({ ...p, [tubeConfig.denom]: p[tubeConfig.denom] + (billsInTube * getQ) }));
            
            addLog(`🔄 POS2 แลกไทเดน (ผ่าน POS1): POS2 จ่าย ${exPayDenom}x${payQ}ให้ POS1 | ฉีกหลอด ${tubeConfig.denom}x${getQ*billsInTube} ใส่ POS2`);
          } else {
            setTidel(p => ({ ...p, [exGetTube]: Math.max(0, p[exGetTube] - getQ) }));
            setPos1(p => ({ ...p, [tubeConfig.denom]: p[tubeConfig.denom] + (billsInTube * getQ) }));
            addLog(`🔄 POS1 ดึงหลอดไทเดน: ช่อง ${exGetTube} ฉีกเข้าเก๊ะ ${tubeConfig.denom}x${billsInTube * getQ}`);
          }
        } 
        // 4. แลกเงินใต้เครื่องแบบแลกเปลี่ยน
        else if (exType === 'internal_under') {
          const drawerSetter = exPos === 'pos1' ? setPos1 : setPos2;
          const drawerState = exPos === 'pos1' ? pos1 : pos2;

          if (drawerState[exPayDenom] < payQ) return alert(`ลิ้นชัก ${exPos.toUpperCase()} ไม่พอจ่าย!`);
          
          drawerSetter(p => ({ ...p, [exPayDenom]: p[exPayDenom] - payQ, [exGetDenom]: p[exGetDenom] + getQ }));
          setUnderMachine(p => parseFloat(p||0) + payValue - getValue);

          addLog(`🔄 ${exPos.toUpperCase()} แลกใต้เครื่อง: เก็บ ${exPayDenom}x${payQ} | หยิบทอน ${exGetDenom}x${getQ}`);
        }

        setExPayQty(''); setExGetQty(''); alert('ทำรายการเรียบร้อย!'); setActiveTab('count'); 
      };

      return (
        <div className="flex flex-col h-screen w-full max-w-lg mx-auto bg-slate-100 shadow-xl overflow-hidden relative">
          
          {/* Top Header */}
          <div className="bg-slate-800 text-white p-3 flex justify-between items-center z-10 shrink-0">
            <div>
              <h1 className="font-bold text-lg">💰 POS Manager</h1>
              <p className="text-[10px] text-slate-300">ตัวช่วยจำเงินสด POS1 / POS2</p>
            </div>
            <div className="text-right">
              <div className="text-xs text-slate-400">รวมทั้งร้าน (ระบบจำลอง)</div>
              <div className="font-bold text-xl text-emerald-400">฿{formatCurr(grandTotal)}</div>
            </div>
          </div>

          {/* Main Content Area (Scrollable) */}
          <div className="flex-1 overflow-y-auto pb-24">
            
            {/* ---------------- TAB 1: หน้าขาย (Action) ---------------- */}
            {activeTab === 'action' && (
              <div className="p-3 flex flex-col min-h-full">
                
                {/* POS Selector */}
                <div className="flex bg-white rounded-lg p-1 shadow-sm border border-slate-200 mb-3 shrink-0">
                  <button onClick={() => { setActivePos('pos1'); clearTransaction(); }} className={`flex-1 py-2 font-bold rounded-md text-sm ${activePos === 'pos1' ? 'bg-blue-600 text-white shadow' : 'text-slate-500'}`}>💻 POS 1</button>
                  <button onClick={() => { setActivePos('pos2'); clearTransaction(); }} className={`flex-1 py-2 font-bold rounded-md text-sm ${activePos === 'pos2' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500'}`}>💻 POS 2</button>
                </div>

                {/* Mode Selector */}
                <div className="flex gap-2 mb-3 shrink-0">
                  <button onClick={() => setActionMode('receive')} className={`flex-1 py-3 rounded-xl font-bold text-base transition-all ${actionMode === 'receive' ? 'bg-emerald-500 text-white shadow-lg ring-2 ring-emerald-300' : 'bg-white text-slate-500 border border-slate-200'}`}>
                    📥 รับเงินลูกค้า
                  </button>
                  <button onClick={() => setActionMode('change')} className={`flex-1 py-3 rounded-xl font-bold text-base transition-all ${actionMode === 'change' ? 'bg-red-500 text-white shadow-lg ring-2 ring-red-300' : 'bg-white text-slate-500 border border-slate-200'}`}>
                    📤 หยิบทอน
                  </button>
                </div>

                {/* Live Monitor + Details */}
                <div className="bg-slate-800 rounded-xl shadow-md p-3 mb-4 text-white shrink-0">
                  <div className="flex justify-between items-start mb-2">
                    <div className="w-full">
                      <div className="text-sm text-emerald-400 font-bold break-words">
                        รับ: ฿{currentTx.receive} <span className="font-normal text-slate-300 ml-1 text-xs">({renderTxDetails(currentTxDetails.receive)})</span>
                      </div>
                      <div className="text-sm text-red-400 font-bold break-words mt-1">
                        ทอน: ฿{currentTx.change} <span className="font-normal text-slate-300 ml-1 text-xs">({renderTxDetails(currentTxDetails.change)})</span>
                      </div>
                      <div className="text-sm font-bold mt-2 text-blue-300 border-t border-slate-600 pt-1">ยอดบิลสุทธิ: ฿{currentTx.receive - currentTx.change}</div>
                    </div>
                  </div>
                  <div className="flex gap-2 mt-2">
                    <button onClick={cancelTransaction} className="w-1/3 bg-slate-600 text-white py-2 rounded-lg font-bold text-xs shadow hover:bg-slate-500 active:scale-95">
                      ❌ ยกเลิก
                    </button>
                    <button onClick={clearTransaction} className="w-2/3 bg-emerald-500 text-white py-2 rounded-lg font-bold text-xs shadow hover:bg-emerald-400 active:scale-95">
                      ✅ จบลูกค้า (ล้างบิล)
                    </button>
                  </div>
                </div>

                {/* Denom Keyboard (ปรับขนาดเล็กลงเพื่อให้เห็นรายละเอียดมากขึ้น) */}
                <div className="grid grid-cols-3 gap-2 flex-1 pb-4 content-start">
                  {denoms.map(d => {
                    const drawerData = activePos === 'pos1' ? pos1 : pos2;
                    return (
                      <button 
                        key={d} 
                        onClick={() => handleActionClick(d)}
                        className={`btn-press rounded-xl h-16 flex flex-col justify-center items-center shadow-md transition-all ${getDenomColor(d)}`}
                      >
                        <span className="font-bold text-xl">{d >= 1 ? d : `${d * 100} สต.`}</span>
                        <span className="text-[10px] opacity-90 font-medium tracking-tight">ในเก๊ะ: {drawerData[d]}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ---------------- TAB 2: ตรวจนับ (Count) ---------------- */}
            {activeTab === 'count' && (
              <div className="p-3 space-y-3">
                
                <div className="bg-blue-50 p-2 rounded-lg text-xs text-blue-800 font-semibold border border-blue-200 flex items-center gap-2">
                  <span>💡</span> กดที่หัวข้อเพื่อ พับ/ขยาย รายการนับ
                </div>

                {/* POS1 Accordion */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                  <button onClick={() => toggleCountSection('pos1')} className="w-full bg-blue-600 text-white p-3 font-bold flex justify-between items-center active:bg-blue-700">
                    <div className="flex items-center gap-2"><span>{countSections.pos1 ? '▼' : '▶'}</span> 1. ลิ้นชัก POS 1</div>
                    <span>฿{formatCurr(pos1Total)}</span>
                  </button>
                  {countSections.pos1 && (
                    <div className="p-2 grid grid-cols-2 gap-2 bg-slate-50">
                      {denoms.map(d => (
                        <div key={`p1-${d}`} className="flex justify-between items-center bg-white p-1.5 rounded border border-slate-200 shadow-sm">
                          <div className={`w-8 text-center text-[10px] font-bold py-1 rounded ${getDenomColor(d)}`}>{d}</div>
                          <div className="flex items-center gap-1">
                            <button onClick={() => setPos1(p => ({...p, [d]: Math.max(0, p[d]-1)}))} className="w-7 h-7 bg-slate-200 rounded text-red-600 font-bold">-</button>
                            <input type="number" value={pos1[d] === 0 ? '' : pos1[d]} onChange={(e) => setPos1(p => ({...p, [d]: e.target.value === '' ? 0 : parseInt(e.target.value)}))} className="w-10 text-center font-bold outline-none text-sm" placeholder="0" />
                            <button onClick={() => setPos1(p => ({...p, [d]: p[d]+1}))} className="w-7 h-7 bg-slate-200 rounded text-emerald-600 font-bold">+</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* POS2 Accordion */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                  <button onClick={() => toggleCountSection('pos2')} className="w-full bg-indigo-600 text-white p-3 font-bold flex justify-between items-center active:bg-indigo-700">
                    <div className="flex items-center gap-2"><span>{countSections.pos2 ? '▼' : '▶'}</span> 2. ลิ้นชัก POS 2</div>
                    <span>฿{formatCurr(pos2Total)}</span>
                  </button>
                  {countSections.pos2 && (
                    <div className="p-2 grid grid-cols-2 gap-2 bg-slate-50">
                      {denoms.map(d => (
                        <div key={`p2-${d}`} className="flex justify-between items-center bg-white p-1.5 rounded border border-slate-200 shadow-sm">
                          <div className={`w-8 text-center text-[10px] font-bold py-1 rounded ${getDenomColor(d)}`}>{d}</div>
                          <div className="flex items-center gap-1">
                            <button onClick={() => setPos2(p => ({...p, [d]: Math.max(0, p[d]-1)}))} className="w-7 h-7 bg-slate-200 rounded text-red-600 font-bold">-</button>
                            <input type="number" value={pos2[d] === 0 ? '' : pos2[d]} onChange={(e) => setPos2(p => ({...p, [d]: e.target.value === '' ? 0 : parseInt(e.target.value)}))} className="w-10 text-center font-bold outline-none text-sm" placeholder="0" />
                            <button onClick={() => setPos2(p => ({...p, [d]: p[d]+1}))} className="w-7 h-7 bg-slate-200 rounded text-emerald-600 font-bold">+</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Tidel Accordion */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                  <button onClick={() => toggleCountSection('tidel')} className="w-full bg-emerald-600 text-white p-3 font-bold flex justify-between items-center active:bg-emerald-700">
                    <div className="flex items-center gap-2"><span>{countSections.tidel ? '▼' : '▶'}</span> 3. หลอด Tidel</div>
                    <span>฿{formatCurr(tidelTotal)}</span>
                  </button>
                  {countSections.tidel && (
                    <div className="p-3 grid grid-cols-2 gap-2 bg-slate-50">
                      {tidelTubesConfig.map(tube => (
                        <div key={tube.id} className="flex justify-between items-center bg-white p-2 border rounded shadow-sm">
                          <span className="text-[10px] font-bold text-slate-600">{tube.label}</span>
                          <input type="number" value={tidel[tube.id] === 0 ? '' : tidel[tube.id]} onChange={e => setTidel(p => ({...p, [tube.id]: parseInt(e.target.value)||0}))} className="w-12 text-center border border-slate-300 rounded font-bold text-sm" placeholder="0" />
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Under Accordion */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                  <button onClick={() => toggleCountSection('under')} className="w-full bg-amber-600 text-white p-3 font-bold flex justify-between items-center active:bg-amber-700">
                    <div className="flex items-center gap-2"><span>{countSections.under ? '▼' : '▶'}</span> 4. ใต้ลิ้นชัก (สำรอง)</div>
                    <span>฿{formatCurr(underTotal)}</span>
                  </button>
                  {countSections.under && (
                    <div className="p-4 bg-slate-50">
                      <label className="text-xs font-bold text-slate-600 block mb-2">ยอดเงินสดสำรองรวมใต้เครื่อง</label>
                      <input type="number" value={underMachine} onChange={e => setUnderMachine(e.target.value)} className="w-full text-right font-bold text-2xl border-b-2 border-slate-300 focus:border-amber-500 outline-none p-2 bg-transparent" placeholder="0.00" />
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* ---------------- TAB 3: โอนย้าย (Exchange) ---------------- */}
            {activeTab === 'exchange' && (
              <div className="p-4 space-y-4">
                
                <div className="bg-white rounded-xl shadow-md p-4 border border-slate-200">
                  <h2 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><span>🔄</span> เครื่องมือแลก/ดึงเงิน</h2>
                  
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">1. ต้องการทำอะไร?</label>
                      <select value={exType} onChange={e => setExType(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg font-bold text-blue-800 bg-blue-50">
                        <option value="tidel_tube">ดึงหลอด/มัด จากตู้ Tidel</option>
                        <option value="pull_under">ดึงเงินทอนสำรอง (ดึงฟรีไม่ต้องแลก)</option>
                        <option value="internal_under">เอาแบงก์ใหญ่แลกเงินย่อยกับใต้เครื่อง</option>
                        <option value="draft_tidel">ดราฟเงิน (ฝากเงินเข้าตู้ Tidel)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">2. เครื่องไหนทำรายการ?</label>
                      <select value={exPos} onChange={e => setExPos(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg">
                        <option value="pos1">POS 1</option>
                        <option value="pos2">POS 2</option>
                      </select>
                    </div>

                    {/* ซื้อหลอด Tidel */}
                    {exType === 'tidel_tube' && (
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
                        {exPos === 'pos2' && (
                          <div className="flex gap-2">
                            <div className="flex-1">
                              <label className="block text-[10px] font-bold text-slate-500">จ่ายแบงก์ไป POS1</label>
                              <select value={exPayDenom} onChange={e => setExPayDenom(e.target.value)} className="w-full p-2 border rounded">
                                <option value="1000">1000 บาท</option><option value="500">500 บาท</option><option value="100">100 บาท</option>
                              </select>
                            </div>
                            <div className="w-24">
                              <label className="block text-[10px] font-bold text-slate-500">จำนวน (ใบ)</label>
                              <input type="number" value={exPayQty} onChange={e => setExPayQty(e.target.value)} className="w-full p-2 border rounded text-center" placeholder="0" />
                            </div>
                          </div>
                        )}

                        <div className="flex gap-2">
                          <div className="flex-1">
                            <label className="block text-[10px] font-bold text-slate-500">ดึงหลอดจากช่อง</label>
                            <select value={exGetTube} onChange={e => setExGetTube(e.target.value)} className="w-full p-2 border rounded">
                              {tidelTubesConfig.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                            </select>
                          </div>
                          <div className="w-24">
                            <label className="block text-[10px] font-bold text-slate-500">จำนวน (หลอด)</label>
                            <input type="number" value={exGetQty} onChange={e => setExGetQty(e.target.value)} className="w-full p-2 border rounded text-center" placeholder="0" />
                          </div>
                        </div>
                      </div>
                    )}

                    {/* ดึงสำรอง (ไม่ต้องแลก) */}
                    {exType === 'pull_under' && (
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
                        <div className="text-xs font-bold text-emerald-600 mb-2">ดึงเงินสำรองใต้เครื่องใส่ลิ้นชัก (ยอดใต้เครื่องจะลดลง)</div>
                        <div className="flex gap-2">
                          <div className="flex-1">
                            <label className="block text-[10px] font-bold text-slate-500">สิ่งที่นำมาเติมเก๊ะ</label>
                            <select value={exGetDenom} onChange={e => setExGetDenom(e.target.value)} className="w-full p-2 border rounded">
                              {denoms.map(d => <option key={d} value={d}>{d >= 1 ? `แบงก์/เหรียญ ${d}` : `${d*100} สต.`}</option>)}
                            </select>
                          </div>
                          <div className="w-24"><label className="block text-[10px] font-bold text-slate-500">จำนวน (ใบ/ชิ้น)</label><input type="number" value={exGetQty} onChange={e => setExGetQty(e.target.value)} className="w-full p-2 border rounded text-center" placeholder="0" /></div>
                        </div>
                      </div>
                    )}

                    {/* แลกเงินใต้เครื่องแบบหักยอด */}
                    {exType === 'internal_under' && (
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
                        <div className="flex gap-2">
                          <div className="flex-1">
                            <label className="block text-[10px] font-bold text-slate-500">เอาไปเก็บใต้เครื่อง</label>
                            <select value={exPayDenom} onChange={e => setExPayDenom(e.target.value)} className="w-full p-2 border rounded">
                              <option value="1000">1000 บาท</option><option value="500">500 บาท</option><option value="100">100 บาท</option>
                            </select>
                          </div>
                          <div className="w-24"><label className="block text-[10px] font-bold text-slate-500">จำนวน (ใบ)</label><input type="number" value={exPayQty} onChange={e => setExPayQty(e.target.value)} className="w-full p-2 border rounded text-center" placeholder="0" /></div>
                        </div>
                        <div className="flex gap-2">
                          <div className="flex-1">
                            <label className="block text-[10px] font-bold text-slate-500">หยิบทอนเข้าลิ้นชัก</label>
                            <select value={exGetDenom} onChange={e => setExGetDenom(e.target.value)} className="w-full p-2 border rounded">
                              {denoms.filter(d=>d<=100).map(d => <option key={d} value={d}>{d >= 1 ? `แบงก์/เหรียญ ${d}` : `${d*100} สต.`}</option>)}
                            </select>
                          </div>
                          <div className="w-24"><label className="block text-[10px] font-bold text-slate-500">จำนวน (ชิ้น)</label><input type="number" value={exGetQty} onChange={e => setExGetQty(e.target.value)} className="w-full p-2 border rounded text-center" placeholder="0" /></div>
                        </div>
                      </div>
                    )}

                    {/* ดราฟเงินลง Tidel */}
                    {exType === 'draft_tidel' && (
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
                         <div className="text-xs font-bold text-red-600 mb-2">ระบุจำนวนแบงก์ที่จะนำจาก {exPos.toUpperCase()} หยอดลง Tidel</div>
                         {[1000, 500, 100, 50, 20].map(d => (
                           <div key={`draft-${d}`} className="flex justify-between items-center border-b border-slate-200 pb-1">
                             <label className="text-sm font-bold text-slate-600">แบงก์ {d}</label>
                             <div className="flex items-center gap-2">
                               <input type="number" value={draftAmounts[d]} onChange={(e) => setDraftAmounts(p => ({...p, [d]: e.target.value}))} className="w-20 p-1 border border-slate-300 rounded text-center font-bold" placeholder="จำนวนใบ" />
                             </div>
                           </div>
                         ))}
                      </div>
                    )}

                    <button onClick={executeExchange} className="w-full py-3 bg-slate-800 text-white rounded-lg font-bold shadow-lg active:scale-95 transition-transform">
                      ✅ ยืนยันทำรายการ
                    </button>
                  </div>
                </div>

                {/* Mini Log */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200">
                  <div className="bg-slate-100 p-2 font-bold text-xs text-slate-600 border-b">📝 ประวัติรายการล่าสุด</div>
                  <div className="h-40 overflow-y-auto p-2 text-xs space-y-1.5">
                    {logs.length === 0 ? <div className="text-center text-slate-400 py-4">ยังไม่มีประวัติ</div> : 
                      logs.map((l, i) => (
                        <div key={i} className="border-b border-slate-50 pb-1.5 leading-tight">
                          <span className="text-slate-400 mr-1 text-[10px]">{l.time}</span> <span className="text-slate-700">{l.msg}</span>
                        </div>
                      ))
                    }
                  </div>
                </div>

              </div>
            )}

            {/* ---------------- TAB 4: ซิงค์/ข้อมูล (Sync) ---------------- */}
            {activeTab === 'sync' && (
              <div className="p-4 space-y-4">
                
                <div className="bg-white rounded-xl shadow-md p-5 border border-slate-200 text-center space-y-6">
                  <h2 className="font-bold text-lg text-slate-800 flex items-center justify-center gap-2"><span>☁️</span> ซิงค์ข้อมูลระหว่างเครื่อง</h2>
                  <p className="text-xs text-slate-500">คุณสามารถโอนข้อมูลหน้าจอนี้ ไปยังเครื่องอื่นได้ โดยการดาวน์โหลดไฟล์ และนำไปอัปโหลดที่อีกเครื่อง</p>
                  
                  <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <h3 className="font-bold text-blue-800 mb-2">📤 เครื่องต้นทาง (Export)</h3>
                    <button onClick={exportData} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow hover:bg-blue-700">
                      ดาวน์โหลดไฟล์การนับปัจจุบัน
                    </button>
                  </div>

                  <div className="bg-emerald-50 p-4 rounded-lg border border-emerald-100">
                    <h3 className="font-bold text-emerald-800 mb-2">📥 เครื่องปลายทาง (Import)</h3>
                    <input 
                      type="file" 
                      accept=".json" 
                      ref={fileInputRef} 
                      className="hidden" 
                      onChange={importData} 
                    />
                    <button onClick={() => fileInputRef.current.click()} className="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold shadow hover:bg-emerald-700">
                      เลือกไฟล์เพื่ออัปโหลดข้อมูล
                    </button>
                  </div>
                </div>

                <button onClick={() => {
                  if(window.confirm('⚠️ ล้างข้อมูลการนับทั้งหมดเพื่อเริ่มกะใหม่ หรือลบข้อมูลปัจจุบันทิ้ง?')) {
                    setPos1({...defaultDrawer}); setPos2({...defaultDrawer});
                    setTidel({ t1_20:0, t2_20:0, t3_20:0, t4_100:0, t5_100:0, t6_100:0, t7_100:0, t8_100:0 }); 
                    setUnderMachine(''); setLogs([]); setCurrentTx({receive:0,change:0}); setCurrentTxDetails({receive:{},change:{}});
                    alert('ล้างข้อมูลเรียบร้อยแล้ว');
                  }
                }} className="w-full py-4 text-red-500 font-bold bg-white border border-red-200 rounded-xl shadow-sm">
                  🗑️ ล้างข้อมูลทั้งหมด (Reset)
                </button>

              </div>
            )}

          </div>

          {/* Bottom Tabs */}
          <div className="bg-white border-t border-slate-200 absolute bottom-0 w-full flex justify-around pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
            <button onClick={() => setActiveTab('action')} className={`flex-1 flex flex-col items-center py-2.5 text-[10px] font-bold ${activeTab === 'action' ? 'text-blue-600' : 'text-slate-400'}`}>
              <span className="text-xl mb-1">{activeTab === 'action' ? '🛍️' : '🛒'}</span>รับ/ทอน
            </button>
            <button onClick={() => setActiveTab('count')} className={`flex-1 flex flex-col items-center py-2.5 text-[10px] font-bold ${activeTab === 'count' ? 'text-emerald-600' : 'text-slate-400'}`}>
              <span className="text-xl mb-1">🧮</span>ตรวจนับ
            </button>
            <button onClick={() => setActiveTab('exchange')} className={`flex-1 flex flex-col items-center py-2.5 text-[10px] font-bold ${activeTab === 'exchange' ? 'text-amber-600' : 'text-slate-400'}`}>
              <span className="text-xl mb-1">🔄</span>ดราฟ/แลก
            </button>
            <button onClick={() => setActiveTab('sync')} className={`flex-1 flex flex-col items-center py-2.5 text-[10px] font-bold ${activeTab === 'sync' ? 'text-purple-600' : 'text-slate-400'}`}>
              <span className="text-xl mb-1">☁️</span>ซิงค์
            </button>
          </div>

          <style>{`.pb-safe { padding-bottom: env(safe-area-inset-bottom); }`}</style>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<POSCashTracker />);
  </script>
</body>
</html>
