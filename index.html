<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS Cash Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom-server.browser.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; overscroll-behavior-y: auto; }
    .bg-b1000 { background-color: #94a3b8; color: white; border-bottom: 4px solid #64748b; }
    .bg-b500 { background-color: #a855f7; color: white; border-bottom: 4px solid #7e22ce; }
    .bg-b100 { background-color: #ef4444; color: white; border-bottom: 4px solid #b91c1c; }
    .bg-b50 { background-color: #3b82f6; color: white; border-bottom: 4px solid #1d4ed8; }
    .bg-b20 { background-color: #22c55e; color: white; border-bottom: 4px solid #15803d; }
    .bg-coin { background-color: #fbbf24; color: #78350f; border-bottom: 4px solid #d97706; }
    .btn-press:active { transform: translateY(4px); border-bottom-width: 0px; margin-top: 4px; }
    .prevent-select { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const POSCashTracker = () => {
      const [activeTab, setActiveTab] = useState('action');
      const [activePos, setActivePos] = useState('pos1'); 

      const defaultDrawer = { 1000:0, 500:0, 100:0, 50:0, 20:0, 10:0, 5:0, 2:0, 1:0, 0.5:0, 0.25:0 };
      const [pos1, setPos1] = useState({...defaultDrawer});
      const [pos2, setPos2] = useState({...defaultDrawer});
      const [pos1Stash, setPos1Stash] = useState({...defaultDrawer});
      const [pos2Stash, setPos2Stash] = useState({...defaultDrawer});

      const defaultTidel = { t1_20:0, t2_20:0, t3_20:0, t4_100:0, t5_100:0, t6_100:0, t7_100:0, t8_100:0 };
      const [tidel, setTidel] = useState({...defaultTidel}); 
      const [underMachine, setUnderMachine] = useState(''); 
      const [draftedTotal, setDraftedTotal] = useState(0); 
      const [logs, setLogs] = useState([]);
      const [movements, setMovements] = useState({ pos1: {...defaultDrawer}, pos2: {...defaultDrawer} });
      // [ใหม่] 1. โหลดข้อมูลจาก Local Storage ตอนเปิดเว็บ
      useEffect(() => {
        const savedData = localStorage.getItem('pos_backup_data');
        if (savedData) {
          try {
            const data = JSON.parse(savedData);
            if(data.pos1) setPos1(data.pos1); if(data.pos2) setPos2(data.pos2);
            if(data.pos1Stash) setPos1Stash(data.pos1Stash); if(data.pos2Stash) setPos2Stash(data.pos2Stash);
            if(data.tidel) setTidel(data.tidel); if(data.underMachine !== undefined) setUnderMachine(data.underMachine);
            if(data.variances) setVariances(data.variances);
            if(data.logs) setLogs(data.logs); if(data.baseline !== undefined) setBaseline(data.baseline);
            if(data.salesTotal !== undefined) setSalesTotal(data.salesTotal);
            if(data.depositTotal !== undefined) setDepositTotal(data.depositTotal);
            if(data.breakAdjustments !== undefined) setBreakAdjustments(data.breakAdjustments);
            if(data.rushHourSales !== undefined) setRushHourSales(data.rushHourSales);
            if(data.movements) setMovements(data.movements); if(data.draftedTotal !== undefined) setDraftedTotal(data.draftedTotal);
            if(data.isPostBreak !== undefined) setIsPostBreak(data.isPostBreak);
            if(data.preBreakTotal !== undefined) setPreBreakTotal(data.preBreakTotal);
            if(data.isPostRush !== undefined) setIsPostRush(data.isPostRush);
            if(data.preRushTotal !== undefined) setPreRushTotal(data.preRushTotal);
          } catch(err) {
            console.error("Failed to load local storage data", err);
          }
        }
      }, []);

      // [ใหม่] 2. บันทึกข้อมูลลง Local Storage อัตโนมัติเมื่อ State เปลี่ยน
      useEffect(() => {
        const dataToSave = {
          pos1, pos2, pos1Stash, pos2Stash, tidel, underMachine, logs,
          baseline, salesTotal, depositTotal, breakAdjustments, rushHourSales,
          movements, draftedTotal, isPostBreak, preBreakTotal, isPostRush, preRushTotal, variances
        };
        localStorage.setItem('pos_backup_data', JSON.stringify(dataToSave));
      }, [pos1, pos2, pos1Stash, pos2Stash, tidel, underMachine, logs, baseline, salesTotal, depositTotal, breakAdjustments, rushHourSales, movements, draftedTotal, isPostBreak, preBreakTotal, isPostRush, preRushTotal, variances]);
      
      const defaultVariances = { pos1: {...defaultDrawer}, pos2: {...defaultDrawer}, tidel: {...defaultTidel}, under: 0 };
      const [variances, setVariances] = useState(defaultVariances);

      const denoms = [1000, 500, 100, 50, 20, 10, 5, 2, 1, 0.5, 0.25];
      const tidelTubesConfig = [
        { id: 't1_20', label: 'ช่อง 1 (มูลค่า 200)', val: 200, denom: 20 }, { id: 't2_20', label: 'ช่อง 2 (มูลค่า 200)', val: 200, denom: 20 },
        { id: 't3_20', label: 'ช่อง 3 (มูลค่า 200)', val: 200, denom: 20 }, { id: 't4_100', label: 'ช่อง 4 (มูลค่า 1000)', val: 1000, denom: 100 },
        { id: 't5_100', label: 'ช่อง 5 (มูลค่า 1000)', val: 1000, denom: 100 }, { id: 't6_100', label: 'ช่อง 6 (มูลค่า 1000)', val: 1000, denom: 100 },
        { id: 't7_100', label: 'ช่อง 7 (มูลค่า 1000)', val: 1000, denom: 100 }, { id: 't8_100', label: 'ช่อง 8 (มูลค่า 1000)', val: 1000, denom: 100 }
      ];
      
      const getDenomColor = (val) => {
        if(val === 1000) return 'bg-b1000'; if(val === 500) return 'bg-b500';
        if(val === 100) return 'bg-b100'; if(val === 50) return 'bg-b50';
        if(val === 20) return 'bg-b20'; return 'bg-coin';
      };

      const [baseline, setBaseline] = useState(null); 
      const [salesTotal, setSalesTotal] = useState(0);
      const [depositTotal, setDepositTotal] = useState(0);
      const [breakAdjustments, setBreakAdjustments] = useState(0); 
      // [ใหม่] เพิ่มตัวแปรเก็บยอดช่วง Rush Hour
      const [rushHourSales, setRushHourSales] = useState(0);

      const [actionMode, setActionMode] = useState('receive'); 
      const [txType, setTxType] = useState('sales'); 
      const [currentTx, setCurrentTx] = useState({ receive: 0, change: 0 });
      const [currentTxDetails, setCurrentTxDetails] = useState({ receive: {}, change: {} });

      const [isPaused, setIsPaused] = useState(false);
      const [isPostBreak, setIsPostBreak] = useState(false); 
      const [preBreakTotal, setPreBreakTotal] = useState(0); 

      // [ใหม่] ตัวแปรควบคุมหน้าจอ Rush Hour
      const [isRushHour, setIsRushHour] = useState(false);
      const [isPostRush, setIsPostRush] = useState(false);
      const [preRushTotal, setPreRushTotal] = useState(0);

      const [countSections, setCountSections] = useState({ pos1: true, pos2: false, tidel: false, under: false });
      const [focusValTracker, setFocusValTracker] = useState(0); 
      
      const toggleCountSection = (sectionKey) => {
        setCountSections(prev => ({
          ...prev,
          [sectionKey]: !prev[sectionKey]
        }));
      };

      const fileInputRef = useRef(null);
      const summaryRef = useRef(null);
      const logContainerRef = useRef(null);
      
      // ระบบจำตำแหน่งเลื่อนจอ
      const scrollContainerRef = useRef(null);
      const scrollPositions = useRef({ action: 0, count: 0, exchange: 0, summary: 0, sync: 0 });

      const handleScroll = (e) => {
        scrollPositions.current[activeTab] = e.target.scrollTop;
      };

      useEffect(() => {
        const timer = setTimeout(() => {
          if (scrollContainerRef.current) {
            scrollContainerRef.current.scrollTop = scrollPositions.current[activeTab] || 0;
          }
        }, 10);
        return () => clearTimeout(timer);
      }, [activeTab]);

      // State สำหรับระบบเลือก Log
      const [isLogSelectMode, setIsLogSelectMode] = useState(false);
      const [selectedLogIds, setSelectedLogIds] = useState(new Set());
      const [printViewData, setPrintViewData] = useState(null);

      const [currentTime, setCurrentTime] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const calcTotal = (obj) => Object.entries(obj).reduce((sum, [val, qty]) => sum + (parseFloat(val) * (qty||0)), 0);
      const formatCurr = (amt) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(amt);
      
      // ฟังก์ชันนักระบายสีสำหรับประวัติ
      const formatLogDetail = (text) => {
        if (typeof text !== 'string') return text;
        const parts = text.split(/(\([+-][0-9.,]+\)|\[ส:[+-][0-9.,]+\])/g);
        return parts.map((part, i) => {
          if (part.startsWith('(') && (part.includes('+') || part.includes('-'))) {
             const isPos = part.includes('+');
             return <span key={i} className={`font-bold ml-1 ${isPos ? 'text-emerald-500' : 'text-red-500'}`}>{part}</span>;
          }
          if (part.startsWith('[ส:')) {
             const isPos = part.includes('+');
             return <span key={i} className={`font-bold ml-1 ${isPos ? 'text-blue-500' : 'text-orange-500'}`}>{part}</span>;
          }
          return part; 
        });
      };
      
      const renderTxDetails = (detailsObj) => {
        if (!detailsObj || Object.keys(detailsObj).length === 0) return '';
        const items = Object.entries(detailsObj)
          .filter(([_, qty]) => qty > 0)
          .map(([val, qty]) => `${val >= 1 ? val : parseFloat(val) * 100 + 'ส'}x${qty}`);
        return items.length > 0 ? items.join(', ') : '';
      };
      
      const pos1Total = calcTotal(pos1) + calcTotal(pos1Stash); 
      const pos2Total = calcTotal(pos2) + calcTotal(pos2Stash);
      const tidelTotal = tidelTubesConfig.reduce((sum, tube) => sum + ((tidel[tube.id] || 0) * tube.val), 0);
      const underTotal = parseFloat(underMachine) || 0;
      
      const grandTotal = pos1Total + pos2Total + tidelTotal + underTotal + draftedTotal;
      // [อัปเดต] นำยอด Rush Hour มาคำนวณในเป้าหมายระบบ
      const expectedTotal = (baseline || 0) + salesTotal + depositTotal + breakAdjustments + rushHourSales;
      const variance = baseline !== null ? grandTotal - expectedTotal : 0;

      const [showVarAlert, setShowVarAlert] = useState(null);
      const prevVarRef = useRef(0);
      const alertTimerRef = useRef(null);

      const addLog = (msg, diffAmt = 0, detailsList = [], nextVar = null, actionKey = null) => {
        const finalVar = nextVar !== null ? nextVar : variance;
        const now = new Date();

        if (nextVar !== null && nextVar !== prevVarRef.current) {
            const varDiff = nextVar - prevVarRef.current;
            if (nextVar !== 0) {
                setShowVarAlert({ diff: varDiff, totalVar: nextVar });
                if (alertTimerRef.current) clearTimeout(alertTimerRef.current);
                alertTimerRef.current = setTimeout(() => setShowVarAlert(null), 4000);
            } else {
                setShowVarAlert(null); 
            }
            prevVarRef.current = nextVar;
        }

        setLogs(prev => {
           if (actionKey && prev.length > 0) {
               const lastLog = prev[0];
               if (lastLog.actionKey === actionKey && (now - lastLog.rawTime) < 10000) {
                   const updatedLog = {
                       ...lastLog,
                       time: now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                       rawTime: now, diff: lastLog.diff + diffAmt, totalVar: finalVar, details: detailsList, msg: msg 
                   };
                   return [updatedLog, ...prev.slice(1)];
               }
           }
           
           return [{
               id: Date.now() + Math.random(),
               time: now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
               rawTime: now, msg, diff: diffAmt, totalVar: finalVar, details: detailsList, isOpen: false, actionKey
           }, ...prev].slice(0, 100); 
        });
      };

      const toggleLogDetail = (id) => {
        if (isLogSelectMode) {
           setSelectedLogIds(prev => {
              const next = new Set(prev);
              if (next.has(id)) next.delete(id); else next.add(id);
              return next;
           });
           return;
        }
        setLogs(prev => prev.map(l => l.id === id ? { ...l, isOpen: !l.isOpen } : l));
      };

      const renderPosJSX = (loose, stash, vObj, deltaObj) => {
        const items = denoms.map(d => {
          const l = loose[d] || 0; const s = stash[d] || 0; const v = vObj[d] || 0; const delta = deltaObj[d] || 0;
          if (l === 0 && s === 0 && v === 0 && delta === 0) return null;
          let text = `${d>=1?d:d*100+'ส'}x${l+s}`;
          if (s > 0) text += `(แยก${s})`;
          let badges = [];
          if (delta !== 0) badges.push(<span key="d" className={`font-bold ml-1 ${delta > 0 ? 'text-emerald-600' : 'text-red-600'}`}>({delta > 0 ? '+' : ''}{delta})</span>);
          if (v !== 0) badges.push(<span key="v" className={`font-bold ml-1 ${v > 0 ? 'text-blue-600' : 'text-orange-600'}`}>[ส:{v > 0 ? '+' : ''}{v}]</span>);
          return <span key={d} className="whitespace-nowrap inline-flex items-center">{text}{badges}</span>;
        }).filter(Boolean);
        if (items.length === 0) return <span className="text-slate-400">ไม่มี</span>;
        return items.reduce((prev, curr, i) => [prev, <span key={'c'+i}>, </span>, curr]);
      };

      const renderTidelJSX = (tiState, vTi, deltaTi) => {
        const items = tidelTubesConfig.map(t => {
          const count = tiState[t.id] || 0; const v = vTi[t.id] || 0; const delta = deltaTi[t.id] || 0;
          if (count === 0 && v === 0 && delta === 0) return null;
          let text = `ช.${t.id.split('_')[0].replace('t','')}x${count}`;
          let badges = [];
          if (delta !== 0) badges.push(<span key="d" className={`font-bold ml-1 ${delta > 0 ? 'text-emerald-600' : 'text-red-600'}`}>({delta > 0 ? '+' : ''}{delta})</span>);
          if (v !== 0) badges.push(<span key="v" className={`font-bold ml-1 ${v > 0 ? 'text-blue-600' : 'text-orange-600'}`}>[ส:{v > 0 ? '+' : ''}{v}]</span>);
          return <span key={t.id} className="whitespace-nowrap inline-flex items-center">{text}{badges}</span>;
        }).filter(Boolean);
        if (items.length === 0) return <span className="text-slate-400">ไม่มีหลอด</span>;
        return items.reduce((prev, curr, i) => [prev, <span key={'c'+i}>, </span>, curr]);
      };

      const renderPosString = (loose, stash, vObj, deltaObj) => {
        const items = denoms.map(d => {
          const l = loose[d] || 0; const s = stash[d] || 0; const v = vObj[d] || 0; const delta = deltaObj[d] || 0;
          if (l === 0 && s === 0 && v === 0 && delta === 0) return null;
          let text = `${d >= 1 ? d : d * 100 + 'ส'}x${l + s}`;
          if (s > 0) text += `(แยก${s})`;
          if (delta !== 0) text += ` (${delta > 0 ? '+' : ''}${delta})`;
          if (v !== 0) text += ` [ส:${v > 0 ? '+' : ''}${v}]`;
          return text;
        }).filter(Boolean);
        return items.length === 0 ? "ไม่มี" : items.join(", ");
      };

      const renderTidelString = (tiState, vTi, deltaTi) => {
        const items = tidelTubesConfig.map(t => {
          const count = tiState[t.id] || 0; const v = vTi[t.id] || 0; const delta = deltaTi[t.id] || 0;
          if (count === 0 && v === 0 && delta === 0) return null;
          let text = `ช.${t.id.split('_')[0].replace('t','')}x${count}`;
          if (delta !== 0) text += ` (${delta > 0 ? '+' : ''}${delta})`;
          if (v !== 0) text += ` [ส:${v > 0 ? '+' : ''}${v}]`;
          return text;
        }).filter(Boolean);
        return items.length === 0 ? "ไม่มีหลอด" : items.join(", ");
      };

      const getFullStatusDetails = (overrides = {}, explicitDeltas = null) => {
          const p1 = overrides.pos1 || pos1; const p1S = overrides.pos1Stash || pos1Stash;
          const p2 = overrides.pos2 || pos2; const p2S = overrides.pos2Stash || pos2Stash;
          const ti = overrides.tidel || tidel;
          const un = overrides.underMachine !== undefined ? overrides.underMachine : underMachine;
          const vP1 = overrides.vPos1 || variances.pos1;
          const vP2 = overrides.vPos2 || variances.pos2;
          const vTi = overrides.vTidel || variances.tidel;
          const vUn = overrides.vUnder !== undefined ? overrides.vUnder : variances.under;

          const deltaP1 = explicitDeltas?.pos1 || {}; const deltaP2 = explicitDeltas?.pos2 || {};
          const deltaTi = explicitDeltas?.tidel || {}; let deltaUn = explicitDeltas?.under !== undefined ? explicitDeltas.under : 0;

          if (!explicitDeltas) {
              denoms.forEach(d => {
                  const old1 = (pos1[d]||0) + (pos1Stash[d]||0); const new1 = (p1[d]||0) + (p1S[d]||0);
                  if (new1 !== old1) deltaP1[d] = new1 - old1;
                  const old2 = (pos2[d]||0) + (pos2Stash[d]||0); const new2 = (p2[d]||0) + (p2S[d]||0);
                  if (new2 !== old2) deltaP2[d] = new2 - old2;
              });
              tidelTubesConfig.forEach(t => {
                  const oldT = tidel[t.id] || 0; const newT = ti[t.id] || 0;
                  if (newT !== oldT) deltaTi[t.id] = newT - oldT;
              });
              deltaUn = un - (parseFloat(underMachine) || 0);
          }

          const tP1 = calcTotal(p1) + calcTotal(p1S); const tP2 = calcTotal(p2) + calcTotal(p2S);
          const tTi = tidelTubesConfig.reduce((sum, t) => sum + ((ti[t.id]||0)*t.val), 0); const tUn = parseFloat(un) || 0;

          return [
             `💻 POS1: ฿${formatCurr(tP1)} [${renderPosString(p1, p1S, vP1, deltaP1)}]`,
             `💻 POS2: ฿${formatCurr(tP2)} [${renderPosString(p2, p2S, vP2, deltaP2)}]`,
             `📦 Tidel: ฿${formatCurr(tTi)} [${renderTidelString(ti, vTi, deltaTi)}]`,
             `📥 ใต้ลิ้นชัก: ฿${formatCurr(tUn)} ${deltaUn !== 0 ? `(${deltaUn > 0 ? '+' : ''}${formatCurr(deltaUn)})` : ''} ${vUn !== 0 ? `[ส:${vUn > 0 ? '+' : ''}${formatCurr(vUn)}]` : ''}`
          ];
      };

      const exportLogsHTML = () => {
          const logsToExport = isLogSelectMode && selectedLogIds.size > 0
              ? logs.filter(l => selectedLogIds.has(l.id))
              : logs;

          if (logsToExport.length === 0) return alert('ไม่มีประวัติให้ส่งออก (กรุณาเลือกรายการก่อน)');

          setPrintViewData(logsToExport);
          setIsLogSelectMode(false);
          setSelectedLogIds(new Set());
      };

      const timerRef = useRef(null);
      const isLongPressActive = useRef(false);
      const [showLongPressMenu, setShowLongPressMenu] = useState(false);
      const [longPressData, setLongPressData] = useState({ denom: null, qtyInput: '' });
      const [showQtyInput, setShowQtyInput] = useState(false);

      const handlePressStart = (e, val) => {
        isLongPressActive.current = false;
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          isLongPressActive.current = true;
          setLongPressData({ denom: val, qtyInput: '' }); setShowQtyInput(false); setShowLongPressMenu(true);
        }, 500); 
      };

      const handlePressEnd = (e, val) => {
        e.preventDefault(); 
        if (timerRef.current) clearTimeout(timerRef.current);
        if (!isLongPressActive.current && !showLongPressMenu) handleActionClick(val);
      };

      const resetDenomTx = (denom) => {
         const isReceive = actionMode === 'receive';
         const targetQty = currentTxDetails[actionMode][denom] || 0;
         if (targetQty === 0) return setShowLongPressMenu(false);

         const drawerState = activePos === 'pos1' ? pos1 : pos2;
         const drawerSetter = activePos === 'pos1' ? setPos1 : setPos2;
         
         const nextState = { ...drawerState, [denom]: drawerState[denom] + (isReceive ? -targetQty : targetQty) };
         const overrides = activePos === 'pos1' ? { pos1: nextState } : { pos2: nextState };

         drawerSetter(nextState);
         setMovements(prev => ({ ...prev, [activePos]: { ...prev[activePos], [denom]: prev[activePos][denom] + (isReceive ? -targetQty : targetQty) } }));
         
         if (isReceive) setCurrentTx(prev => ({ ...prev, receive: prev.receive - (targetQty * denom) }));
         else setCurrentTx(prev => ({ ...prev, change: prev.change - (targetQty * denom) }));
         
         setCurrentTxDetails(prev => { const nextModeObj = { ...prev[actionMode] }; delete nextModeObj[denom]; return { ...prev, [actionMode]: nextModeObj }; });
         
         const diffVal = (targetQty * denom) * (isReceive ? -1 : 1);
         const nextVar = variance + diffVal; 
         const explicitDeltas = { [activePos]: { [denom]: (isReceive ? -targetQty : targetQty) } };
         addLog(`♻️ ยกเลิกปุ่ม ${denom} (เฉพาะโหมด${isReceive ? 'รับเงิน' : 'หยิบทอน'})`, diffVal, [
             `คืนเก๊ะ: POS ${activePos === 'pos1' ? '1' : '2'}`,
             ...getFullStatusDetails(overrides, explicitDeltas)
         ], nextVar, `RESET_${activePos}_${denom}`);
         setShowLongPressMenu(false);
      };

      const applyDenomQty = (denom, newQty) => {
         const isReceive = actionMode === 'receive'; const currentQty = currentTxDetails[actionMode][denom] || 0;
         const diff = newQty - currentQty; if (diff === 0) return;
         
         const drawerState = activePos === 'pos1' ? pos1 : pos2;
         const drawerSetter = activePos === 'pos1' ? setPos1 : setPos2;
         const nextState = { ...drawerState, [denom]: drawerState[denom] + (isReceive ? diff : -diff) };
         const overrides = activePos === 'pos1' ? { pos1: nextState } : { pos2: nextState };

         drawerSetter(nextState);
         
         setMovements(prev => {
            const isNewTx = currentTx.receive === 0 && currentTx.change === 0; const baseMov = isNewTx ? { ...prev, [activePos]: {...defaultDrawer} } : { ...prev };
            return { ...baseMov, [activePos]: { ...baseMov[activePos], [denom]: baseMov[activePos][denom] + (isReceive ? diff : -diff) } };
         });
         setCurrentTx(prev => ({ ...prev, [actionMode]: prev[actionMode] + (diff * denom) }));
         setCurrentTxDetails(prev => ({ ...prev, [actionMode]: { ...prev[actionMode], [denom]: newQty } }));
         
         const diffVal = diff * denom * (isReceive ? 1 : -1);
         const nextVar = variance + diffVal;
         const explicitDeltas = { [activePos]: { [denom]: (isReceive ? diff : -diff) } };
         addLog(`⌨️ พิมพ์ระบุจำนวนแบงก์/เหรียญ ${denom}`, diffVal, [
             `แก้ไขจำนวนในช่อง: ${isReceive ? 'รับเงิน' : 'หยิบทอน'}`, 
             ...getFullStatusDetails(overrides, explicitDeltas)
         ], nextVar, `INPUT_${activePos}_${denom}`);
      };

      const handleActionClick = (val) => {
        const isReceive = actionMode === 'receive'; const isNewTx = currentTx.receive === 0 && currentTx.change === 0;
        const updateFn = (prev) => ({ ...prev, [val]: (prev[val] || 0) + (isReceive ? 1 : -1) });
        if (activePos === 'pos1') setPos1(updateFn); else setPos2(updateFn);
        setMovements(prev => { const baseMov = isNewTx ? { ...prev, [activePos]: {...defaultDrawer} } : { ...prev }; return { ...baseMov, [activePos]: { ...baseMov[activePos], [val]: baseMov[activePos][val] + (isReceive ? 1 : -1) } }; });
        setCurrentTx(prev => ({ ...prev, receive: isReceive ? prev.receive + val : prev.receive, change: !isReceive ? prev.change + val : prev.change }));
        setCurrentTxDetails(prev => ({ ...prev, [actionMode]: { ...prev[actionMode], [val]: (prev[actionMode][val] || 0) + 1 } }));
      };

      const cancelTransaction = () => {
        if(currentTx.receive === 0 && currentTx.change === 0) return;
        const nextPos1 = { ...pos1 }; const nextPos2 = { ...pos2 };
        const activeDrawer = activePos === 'pos1' ? nextPos1 : nextPos2;
        Object.entries(currentTxDetails.receive).forEach(([val, qty]) => activeDrawer[val] -= qty);
        Object.entries(currentTxDetails.change).forEach(([val, qty]) => activeDrawer[val] += qty);
        
        if (activePos === 'pos1') setPos1(nextPos1); else setPos2(nextPos2);
        setMovements(prev => { const nextMov = { ...prev[activePos] }; Object.entries(currentTxDetails.receive).forEach(([val, qty]) => nextMov[val] -= qty); Object.entries(currentTxDetails.change).forEach(([val, qty]) => nextMov[val] += qty); return { ...prev, [activePos]: nextMov }; });
        
        const overrides = { pos1: nextPos1, pos2: nextPos2 };
        const diffVal = -(currentTx.receive - currentTx.change);
        const nextVar = variance + diffVal;
        
        const txDelta = {};
        Object.entries(currentTxDetails.receive).forEach(([val, qty]) => txDelta[val] = (txDelta[val]||0) - qty);
        Object.entries(currentTxDetails.change).forEach(([val, qty]) => txDelta[val] = (txDelta[val]||0) + qty);
        const explicitDeltas = { [activePos]: txDelta };

        addLog(`❌ ยกเลิกบิล`, diffVal, [ `ยอดรับที่ยกเลิก: ฿${currentTx.receive}`, `ยอดทอนที่ยกเลิก: ฿${currentTx.change}`, ...getFullStatusDetails(overrides, explicitDeltas) ], nextVar);
        setCurrentTx({ receive: 0, change: 0 }); setCurrentTxDetails({ receive: {}, change: {} });
      };

      const clearTransaction = () => {
        if(currentTx.receive > 0 || currentTx.change > 0) {
          const rxDet = renderTxDetails(currentTxDetails.receive); const chDet = renderTxDetails(currentTxDetails.change);
          const net = currentTx.receive - currentTx.change;
          if (txType === 'sales') setSalesTotal(p => p + net); else setDepositTotal(p => p + net);
          
          const nextVar = variance - net; 
          const txDelta = {};
          Object.entries(currentTxDetails.receive).forEach(([val, qty]) => txDelta[val] = (txDelta[val]||0) + qty);
          Object.entries(currentTxDetails.change).forEach(([val, qty]) => txDelta[val] = (txDelta[val]||0) - qty);
          const explicitDeltas = { [activePos]: txDelta };

              `รับจากลูกค้า: ฿${formatCurr(currentTx.receive)} ${rxDet ? `[${rxDet}]` : ''}`,
              `ทอนเงินไป: ฿${formatCurr(currentTx.change)} ${chDet ? `[${chDet}]` : ''}`,
              ...getFullStatusDetails({}, explicitDeltas)

        }
        setCurrentTx({ receive: 0, change: 0 }); setCurrentTxDetails({ receive: {}, change: {} });
        setActionMode('receive'); setTxType('sales');
      };

      const handleCountChange = (pos, denom, newVal) => {
        const val = Math.max(0, parseInt(newVal) || 0); 
        const state = pos === 'pos1' ? pos1 : pos2; const setter = pos === 'pos1' ? setPos1 : setPos2;
        if (state[denom] !== val) { 
           const diffQty = val - state[denom]; const diffVal = diffQty * denom;
           const nextState = { ...state, [denom]: val };
           
           const nextVarState = { ...variances[pos], [denom]: variances[pos][denom] + diffQty };
           setVariances(p => ({ ...p, [pos]: nextVarState }));
           
           const overrides = pos === 'pos1' ? { pos1: nextState, vPos1: nextVarState } : { pos2: nextState, vPos2: nextVarState };
           const explicitDeltas = { [pos]: { [denom]: diffQty } };
           const nextTotalVar = variance + diffVal;
           
           addLog(`🧮 ปรับยอดนับมือ ${pos.toUpperCase()} แบงก์/เหรียญ ${denom}`, diffVal, [
               ...getFullStatusDetails(overrides, explicitDeltas)
           ], nextTotalVar, `COUNT_${pos}_${denom}`); 
           setter(nextState); 
        }
      };

      const handleStashTransfer = (pos, denom, diffQty) => {
        if (diffQty === 0) return;
        const looseState = pos === 'pos1' ? pos1 : pos2;
        const stashState = pos === 'pos1' ? pos1Stash : pos2Stash;
        const looseSetter = pos === 'pos1' ? setPos1 : setPos2;
        const stashSetter = pos === 'pos1' ? setPos1Stash : setPos2Stash;

        const nextLoose = (looseState[denom]||0) - diffQty;
        const nextStash = (stashState[denom]||0) + diffQty;

        looseSetter(p => ({...p, [denom]: nextLoose}));
        stashSetter(p => ({...p, [denom]: nextStash}));

        const overrides = pos === 'pos1'
          ? { pos1: {...looseState, [denom]: nextLoose}, pos1Stash: {...stashState, [denom]: nextStash} }
          : { pos2: {...looseState, [denom]: nextLoose}, pos2Stash: {...stashState, [denom]: nextStash} };

        addLog(`📦 ย้ายเงิน ${pos.toUpperCase()} แบงก์/เหรียญ ${denom}`, 0, [
            `ย้าย ${diffQty > 0 ? 'เข้ามัดแยก' : 'กลับเป็นเศษทอน'} จำนวน ${Math.abs(diffQty)} ใบ/ชิ้น`,
            ...getFullStatusDetails(overrides, { [pos]: {} })

      };

      const handleStashInput = (pos, denom, newVal) => {
        const val = Math.max(0, parseInt(newVal) || 0);
        const currentStash = pos === 'pos1' ? (pos1Stash[denom]||0) : (pos2Stash[denom]||0);
        const diffQty = val - currentStash;
        handleStashTransfer(pos, denom, diffQty);
      };
      
      const handleReturnStashToMain = (pos, denom) => {
        const currentStash = pos === 'pos1' ? (pos1Stash[denom]||0) : (pos2Stash[denom]||0);
        if (currentStash > 0) handleStashTransfer(pos, denom, -currentStash);
      };

      const handleTidelBlur = (tubeId, label, currentVal) => {
        const val = Math.max(0, parseInt(currentVal) || 0);
        if (val !== focusValTracker) {
           const diffQty = val - focusValTracker; const tubeConfig = tidelTubesConfig.find(t => t.id === tubeId); const diffVal = diffQty * tubeConfig.val;
           const nextTi = { ...tidel, [tubeId]: val };
           
           const nextVarState = { ...variances.tidel, [tubeId]: (variances.tidel[tubeId] || 0) + diffQty };
           setVariances(p => ({ ...p, tidel: nextVarState }));
           
           const overrides = { tidel: nextTi, vTidel: nextVarState };
           const explicitDeltas = { tidel: { [tubeId]: diffQty } };
           const nextTotalVar = variance + diffVal;

           addLog(`🧮 พิมพ์ปรับหลอด Tidel (${label})`, diffVal, [
               ...getFullStatusDetails(overrides, explicitDeltas)
           ], nextTotalVar, `TIDEL_UPDATE_${tubeId}`);

        }
      };

      const handleUnderBlur = (currentVal) => {
        const val = parseFloat(currentVal) || 0; const prev = parseFloat(focusValTracker) || 0;
        if (val !== prev) {
            const diffAmt = val - prev;
            const nextVarState = variances.under + diffAmt;
            setVariances(p => ({ ...p, under: nextVarState }));
            
            const overrides = { underMachine: val, vUnder: nextVarState };
            const explicitDeltas = { under: diffAmt };
            const nextTotalVar = variance + diffAmt;

            addLog(`🧮 พิมพ์แก้เงินใต้เครื่อง (สำรอง)`, diffAmt, [
                ...getFullStatusDetails(overrides, explicitDeltas)
            ], nextTotalVar, `UNDER_UPDATE`);
            setUnderMachine(val);
        }
      };

      const handlePauseClick = () => { setPreBreakTotal(grandTotal); setIsPaused(true); };
      const handleResumeBreak = () => { setIsPaused(false); setIsPostBreak(true); setActiveTab('count'); addLog('▶️ กลับจากพักเครื่อง เข้าสู่โหมดตรวจนับยอด', 0, getFullStatusDetails()); };
      const confirmPostBreakCount = () => {

          const nextTotalVar = variance - diff; 
          addLog(`✅ ยืนยันบันทึกยอดหลังพักเครื่อง`, diff, [`ยอดนับได้ก่อนพัก: ฿${formatCurr(preBreakTotal)}`, `ยอดนับได้หลังพัก: ฿${formatCurr(grandTotal)}`, ...getFullStatusDetails()], nextTotalVar); 
          alert(`บันทึกยอดช่วงพักสำเร็จ (${diff >= 0 ? '+' : ''}฿${formatCurr(diff)})`); 
      };

      // [ฟังก์ชันใหม่] จัดการปุ่ม Rush Hour
      const handleRushClick = () => { setPreRushTotal(grandTotal); setIsRushHour(true); };
      const handleResumeRush = () => { setIsRushHour(false); setIsPostRush(true); setActiveTab('count'); addLog('▶️ จบโหมดเร่งด่วน เตรียมตรวจนับยอดขาย', 0, getFullStatusDetails()); };
      const confirmPostRushCount = () => {
          const diff = grandTotal - preRushTotal;
          setRushHourSales(p => p + diff);
          setIsPostRush(false);
          const nextTotalVar = variance - diff;
          addLog(`✅ ยืนยันยอดขายช่วงเร่งด่วน (Rush Hour)`, diff, [`ยอดก่อนเริ่ม: ฿${formatCurr(preRushTotal)}`, `นับได้หลังจบ: ฿${formatCurr(grandTotal)}`, ...getFullStatusDetails()], nextTotalVar);
          alert(`บันทึกยอดช่วงเร่งด่วนสำเร็จ (${diff >= 0 ? '+' : ''}฿${formatCurr(diff)})`);
      };

      const exportData = () => {
        const data = { pos1, pos2, pos1Stash, pos2Stash, tidel, underMachine, logs, baseline, salesTotal, depositTotal, breakAdjustments, rushHourSales, movements, draftedTotal, isPostBreak, preBreakTotal, isPostRush, preRushTotal, variances };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }); 
        const a = document.createElement('a');

        const now = new Date();
        const year = now.getFullYear();

        const seconds = String(now.getSeconds()).padStart(2, '0');
        const timeStamp = `${year}${month}${day}_${hours}${minutes}${seconds}`;

        a.download = `POS_Backup_${timeStamp}.json`; 
        a.click(); 
        addLog(`☁️ ส่งออกข้อมูล (Export)`, 0, getFullStatusDetails());
      };

      const importData = (event) => {
        const file = event.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if(data.pos1) setPos1(data.pos1); if(data.pos2) setPos2(data.pos2);
            if(data.pos1Stash) setPos1Stash(data.pos1Stash); if(data.pos2Stash) setPos2Stash(data.pos2Stash);
            if(data.tidel) setTidel(data.tidel); if(data.underMachine !== undefined) setUnderMachine(data.underMachine);
            if(data.variances) setVariances(data.variances);
            if(data.logs) setLogs(data.logs); if(data.baseline !== undefined) setBaseline(data.baseline); if(data.salesTotal !== undefined) setSalesTotal(data.salesTotal);
            if(data.depositTotal !== undefined) setDepositTotal(data.depositTotal); if(data.breakAdjustments !== undefined) setBreakAdjustments(data.breakAdjustments);
            if(data.rushHourSales !== undefined) setRushHourSales(data.rushHourSales);
            if(data.movements) setMovements(data.movements); if(data.draftedTotal !== undefined) setDraftedTotal(data.draftedTotal);
            alert('📥 นำเข้าข้อมูลและซิงค์สำเร็จ!'); addLog(`☁️ นำเข้าข้อมูลซิงค์ (Import)`, 0, getFullStatusDetails(data));
          } catch(err) { alert('ไฟล์ไม่ถูกต้อง'); }
        }; reader.readAsText(file);
      };

      const renderQtyInput = (value, onChange, placeholder = "0") => {

          <div className="flex items-center gap-1 bg-white border border-slate-300 rounded-lg p-1 shadow-sm w-full">

            </button>

      const [exType, setExType] = useState('transfer_out'); 
      const [exPos, setExPos] = useState('pos1'); 
      const [exPayDenom, setExPayDenom] = useState(1000);
      const [exPayQty, setExPayQty] = useState('');
      const [exGetTube, setExGetTube] = useState('t1_20');
      const [exGetDenom, setExGetDenom] = useState(20);
      const [exGetQty, setExGetQty] = useState('');
      const [exDest, setExDest] = useState('tidel'); 
      const [draftAmounts, setDraftAmounts] = useState({ 1000: '', 500: '', 100: '', 50: '', 20: '' });
      const [tidelInputMode, setTidelInputMode] = useState('pure'); 

      const executeExchange = () => {

        let activeDraftAmounts = { ...draftAmounts };
        if (exType === 'fill_tidel' || exType === 'tidel_tube') {
            const getQ = parseInt(exGetQty) || 0;
            const tubeConfig = tidelTubesConfig.find(t => t.id === exGetTube);
            
            if (tidelInputMode === 'pure') {

                activeDraftAmounts[tubeConfig.denom] = (tubeConfig.val / tubeConfig.denom) * getQ;
            } else if (tidelInputMode === 'mixed') {
                activeDraftAmounts = { 1000: 0, 500: 0, 100: 0, 50: 0, 20: 0 };
                if (tubeConfig.denom === 20) {
                    activeDraftAmounts[50] = 2 * getQ; activeDraftAmounts[20] = 5 * getQ;
                } else if (tubeConfig.denom === 100) {
                    activeDraftAmounts[500] = 1 * getQ; activeDraftAmounts[100] = 5 * getQ;
                }

        let nextPos1 = { ...pos1 }; let nextPos2 = { ...pos2 };
        let nextTidel = { ...tidel }; let nextUnder = parseFloat(underMachine) || 0;
        let nextDraftedTotal = draftedTotal;

        if (exType === 'fill_tidel') {
           const getQ = parseInt(exGetQty) || 0; if(getQ <= 0) return alert('กรุณาระบุจำนวนหลอดที่ต้องการหยอด');
           const tubeConfig = tidelTubesConfig.find(t => t.id === exGetTube); const totalValue = tubeConfig.val * getQ;
           let inputtedValue = 0; let transferDetails = [];
           Object.entries(activeDraftAmounts).forEach(([denom, qtyStr]) => { const qty = parseInt(qtyStr) || 0; if (qty > 0) { inputtedValue += qty * parseInt(denom); transferDetails.push(`${denom}x${qty}`); } });
           if (inputtedValue !== totalValue) return alert(`ยอดรวมแบงก์ที่ระบุ (฿${inputtedValue}) ไม่ตรงกับมูลค่าหลอด (฿${totalValue})`);
           
           const explicitDeltas = { pos1: {}, pos2: {}, tidel: { [exGetTube]: getQ } };

           if (exPos === 'under') {

               nextUnder -= totalValue;
               explicitDeltas.under = -totalValue;
           } else {

               Object.entries(activeDraftAmounts).forEach(([denom, qtyStr]) => { const qty = parseInt(qtyStr) || 0; if (qty > 0 && drawerState[denom] < qty) { alert(`แบงก์ ${denom} ในช่องเศษ ${exPos.toUpperCase()} มีไม่พอ!`); hasError = true; } });
               if (hasError) return;
               Object.entries(activeDraftAmounts).forEach(([denom, qtyStr]) => { 
                   const qty = parseInt(qtyStr) || 0; if (qty > 0) {

                     else { nextPos2[denom] -= qty; explicitDeltas.pos2[denom] = -qty; } 
                   }
               });
           }
           nextTidel[exGetTube] += getQ;
           
           setPos1(nextPos1); setPos2(nextPos2); setUnderMachine(nextUnder); setTidel(nextTidel);
           const overrides = { pos1: nextPos1, pos2: nextPos2, underMachine: nextUnder, tidel: nextTidel };
           addLog(`🔽 มัดแบงก์หยอดตู้ Tidel`, 0, [ `จาก: ${exPos === 'under' ? 'ใต้เครื่อง' : exPos.toUpperCase()}`, `เข้าช่อง: ${tubeConfig.label} จำนวน ${getQ} หลอด`, ...getFullStatusDetails(overrides, explicitDeltas) ]);
           setExGetQty(''); setDraftAmounts({ 1000: '', 500: '', 100: '', 50: '', 20: '' }); alert('มัดหลอดหยอดลง Tidel เรียบร้อย!'); setActiveTab('count'); return;
        }

        if (exType === 'tidel_tube') {
           const getQ = parseInt(exGetQty) || 0; if(getQ <= 0) return alert('กรุณาระบุจำนวนหลอดที่ต้องการดึง');
           const tubeConfig = tidelTubesConfig.find(t => t.id === exGetTube); const totalValue = tubeConfig.val * getQ;
           if(tidel[exGetTube] < getQ) return alert('หลอดใน Tidel ที่เลือกมีไม่พอ!');
           let inputtedValue = 0; let transferDetails = [];
           Object.entries(activeDraftAmounts).forEach(([denom, qtyStr]) => { const qty = parseInt(qtyStr) || 0; if (qty > 0) { inputtedValue += qty * parseInt(denom); transferDetails.push(`${denom}x${qty}`); } });
           if (inputtedValue !== totalValue) return alert(`ยอดรวมแบงก์ที่ระบุ (฿${inputtedValue}) ไม่ตรงกับมูลค่าหลอดที่ดึง (฿${totalValue})`);

           const explicitDeltas = { pos1: {}, pos2: {}, tidel: { [exGetTube]: -getQ } };

           if (exPos === 'pos2') {
               const payQ = parseInt(exPayQty) || 0; const payValue = exPayDenom * payQ;

               if(payValue !== totalValue) { if(!window.confirm(`ยอดแลกไม่เท่ากัน! จ่าย ฿${payValue} ได้เงิน ฿${totalValue} ยืนยันทำรายการไหม?`)) return; }
               if (pos2[exPayDenom] < payQ) return alert('เงินเศษในลิ้นชัก POS 2 ไม่พอจ่าย!');
               
               nextPos2[exPayDenom] -= payQ; nextPos1[exPayDenom] += payQ;
               explicitDeltas.pos2[exPayDenom] = -payQ; explicitDeltas.pos1[exPayDenom] = payQ;

               nextTidel[exGetTube] = Math.max(0, nextTidel[exGetTube] - getQ); 
               Object.entries(activeDraftAmounts).forEach(([denom, qtyStr]) => { 
                 const qty = parseInt(qtyStr) || 0; if (qty > 0) { nextPos2[denom] += qty; explicitDeltas.pos2[denom] = (explicitDeltas.pos2[denom]||0) + qty; } 
               });
               
               setPos1(nextPos1); setPos2(nextPos2); setTidel(nextTidel);
               const overrides = { pos1: nextPos1, pos2: nextPos2, tidel: nextTidel };
               addLog(`🔄 POS2 ดึงหลอด Tidel (ฝาก POS1 แลก)`, 0, [ `POS2 จ่าย: ${exPayDenom} จำนวน ${payQ} ใบ (ให้ POS1)`, `POS1 ดึงช่อง: ${tubeConfig.label} จำนวน ${getQ} หลอด`, ...getFullStatusDetails(overrides, explicitDeltas) ]);
           } else {
               nextTidel[exGetTube] = Math.max(0, nextTidel[exGetTube] - getQ); 
               Object.entries(activeDraftAmounts).forEach(([denom, qtyStr]) => { 
                 const qty = parseInt(qtyStr) || 0; if (qty > 0) { nextPos1[denom] += qty; explicitDeltas.pos1[denom] = (explicitDeltas.pos1[denom]||0) + qty; } 
               });
               
               setPos1(nextPos1); setTidel(nextTidel);
               const overrides = { pos1: nextPos1, tidel: nextTidel };
               addLog(`🔄 POS1 ดึงหลอด Tidel ออกมาใช้`, 0, [ `ดึงหลอดช่อง: ${tubeConfig.label} จำนวน ${getQ} หลอด`, ...getFullStatusDetails(overrides, explicitDeltas) ]);
           }
           setExGetQty(''); setExPayQty(''); setDraftAmounts({ 1000: '', 500: '', 100: '', 50: '', 20: '' }); alert('ดึงหลอด Tidel ลงลิ้นชักเรียบร้อย!'); setActiveTab('count'); return;
        }

        if(exType === 'transfer_out') {
           let totalTransfer = 0; let hasError = false; let transferDetails = [];
           Object.entries(draftAmounts).forEach(([denom, qtyStr]) => {
             const qty = parseInt(qtyStr) || 0; if (qty > 0) {
               if (exPos !== 'under') { const drawerState = exPos === 'pos1' ? pos1 : pos2; if (drawerState[denom] < qty) { alert(`แบงก์ ${denom} ในช่องเศษของ ${exPos.toUpperCase()} มีไม่พอ!`); hasError = true; } }
               totalTransfer += qty * parseInt(denom); transferDetails.push(`${denom}x${qty}`);
             }
           });
           if (hasError || totalTransfer === 0) return;
           if (exPos === 'under' && underTotal < totalTransfer) return alert('เงินใต้ลิ้นชักมีไม่พอ!');
           if (exPos === exDest) return alert('ไม่สามารถโอนไปที่เดียวกันได้!');

           const explicitDeltas = { pos1: {}, pos2: {}, under: 0 };

           if (exPos === 'under') { nextUnder -= totalTransfer; explicitDeltas.under -= totalTransfer; } 
           else {
               Object.entries(draftAmounts).forEach(([denom, qtyStr]) => { 
                   const qty = parseInt(qtyStr) || 0; if (qty > 0) { 
                     if (exPos === 'pos1') { nextPos1[denom] -= qty; explicitDeltas.pos1[denom] = -qty; }
                     else { nextPos2[denom] -= qty; explicitDeltas.pos2[denom] = -qty; }
                   }
               }); 
           }
           
           let destName = "";
           if (exDest === 'tidel') { nextDraftedTotal += totalTransfer; destName = "ดราฟลงตู้เซฟ Tidel"; } 
           else if (exDest === 'under') { nextUnder += totalTransfer; explicitDeltas.under += totalTransfer; destName = "ใต้ลิ้นชัก (สำรอง)"; } 
           else if (exDest === 'pos1') { 
               Object.entries(draftAmounts).forEach(([denom, qtyStr]) => { const qty = parseInt(qtyStr) || 0; if (qty > 0) { nextPos1[denom] += qty; explicitDeltas.pos1[denom] = (explicitDeltas.pos1[denom]||0) + qty; } }); 
               destName = "POS 1"; 
           } 
           else if (exDest === 'pos2') { 
               Object.entries(draftAmounts).forEach(([denom, qtyStr]) => { const qty = parseInt(qtyStr) || 0; if (qty > 0) { nextPos2[denom] += qty; explicitDeltas.pos2[denom] = (explicitDeltas.pos2[denom]||0) + qty; } }); 
               destName = "POS 2"; 
           }
           
           setPos1(nextPos1); setPos2(nextPos2); setUnderMachine(nextUnder); setDraftedTotal(nextDraftedTotal);
           const overrides = { pos1: nextPos1, pos2: nextPos2, underMachine: nextUnder };

           addLog(`📤 โอนเงิน/ดราฟเงิน (ไม่เข้าหลอด)`, 0, [ `จาก: ${exPos === 'under' ? 'ใต้ลิ้นชัก' : exPos.toUpperCase()} ➡️ ไปยัง: ${destName}`, ...getFullStatusDetails(overrides, explicitDeltas) ]);
           setDraftAmounts({ 1000: '', 500: '', 100: '', 50: '', 20: '' }); alert('โอนเงินเรียบร้อย!'); setActiveTab('count'); return;
        }

        if(exType === 'pull_under') {
           const getQ = parseInt(exGetQty) || 0; if(getQ <= 0) return alert('ระบุจำนวนใบ/ชิ้น ที่ต้องการดึง');
           const getValue = exGetDenom * getQ; 
           const explicitDeltas = { pos1: {}, pos2: {}, under: -getValue };
           
           if (exPos === 'pos1') { nextPos1[exGetDenom] += getQ; explicitDeltas.pos1[exGetDenom] = getQ; } 
           else { nextPos2[exGetDenom] += getQ; explicitDeltas.pos2[exGetDenom] = getQ; }
           nextUnder -= getValue;
           
           setPos1(nextPos1); setPos2(nextPos2); setUnderMachine(nextUnder);
           const overrides = { pos1: nextPos1, pos2: nextPos2, underMachine: nextUnder };

           addLog(`📥 ดึงเงินทอนจากใต้เครื่อง`, 0, [ `ดึงเข้าเก๊ะ: ${exPos.toUpperCase()}`, ...getFullStatusDetails(overrides, explicitDeltas) ]);
           setExGetQty(''); alert('ดึงเงินสำรองสำเร็จ!'); setActiveTab('count'); return;
        }

        if (exType === 'internal_under') {
          const payQ = parseInt(exPayQty) || 0; const getQ = parseInt(exGetQty) || 0;
          if(getQ <= 0) return alert('กรุณาระบุจำนวนที่จะรับ');
          let payValue = exPayDenom * payQ; let getValue = exGetDenom * getQ;
          if(payQ <= 0) return alert('กรุณาระบุจำนวนที่จะจ่ายให้ถูกต้อง');
          if(payValue !== getValue) { if(!window.confirm(`ยอดแลกไม่เท่ากัน! คุณจ่าย ฿${payValue} ได้เงิน ฿${getValue} ยืนยันทำรายการไหม?`)) return; }
          const drawerState = exPos === 'pos1' ? pos1 : pos2;
          if (drawerState[exPayDenom] < payQ) return alert(`ลิ้นชัก ${exPos.toUpperCase()} ไม่พอจ่าย!`);
          
          const explicitDeltas = { pos1: {}, pos2: {}, under: payValue - getValue };
          if (exPos === 'pos1') { 
              nextPos1[exPayDenom] -= payQ; nextPos1[exGetDenom] += getQ; 
              explicitDeltas.pos1[exPayDenom] = -payQ; explicitDeltas.pos1[exGetDenom] = getQ;
          } else { 
              nextPos2[exPayDenom] -= payQ; nextPos2[exGetDenom] += getQ; 
              explicitDeltas.pos2[exPayDenom] = -payQ; explicitDeltas.pos2[exGetDenom] = getQ;
          }
          nextUnder += (payValue - getValue); 
          
          setPos1(nextPos1); setPos2(nextPos2); setUnderMachine(nextUnder);
          const overrides = { pos1: nextPos1, pos2: nextPos2, underMachine: nextUnder };
          
          addLog(`🔄 แลกแบงก์กับเงินใต้เครื่อง`, 0, [ `เก๊ะที่ทำรายการ: ${exPos.toUpperCase()}`, ...getFullStatusDetails(overrides, explicitDeltas) ]);
          setExPayQty(''); setExGetQty(''); alert('ทำรายการเรียบร้อย!'); setActiveTab('count'); return;
        }
      };

      if (isPaused) {
        return (
          <div className="flex flex-col h-screen w-full max-w-lg mx-auto bg-slate-900 shadow-xl overflow-hidden relative items-center justify-center p-6 text-white">
            <div className="text-6xl mb-4">⏸️</div><h1 className="text-2xl font-bold mb-2">สถานะ: พักเครื่อง</h1>
            <p className="text-slate-400 text-sm text-center mb-8">ขณะที่พักเครื่อง ยอดการรับ-ทอน จะถูกหยุดไว้ชั่วคราว<br/>เมื่อพร้อมกลับมาทำงาน ให้กดปุ่มด้านล่างเพื่อทำการตรวจนับลิ้นชัก และหายอดที่เข้า/ออกระหว่างพักครับ</p>
            <button onClick={handleResumeBreak} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg">▶️ กลับมาทำงาน (ตรวจนับยอดหลังพัก)</button>
          </div>
        );
      }

      // [UI ใหม่] หน้าจอ Rush Hour
      if (isRushHour) {
        return (
          <div className="flex flex-col h-screen w-full max-w-lg mx-auto bg-amber-500 shadow-xl overflow-hidden relative items-center justify-center p-6 text-white">
            <div className="text-6xl mb-4">⚡</div><h1 className="text-2xl font-bold mb-2">โหมดเร่งด่วน (Rush Hour)</h1>
            <p className="text-amber-100 text-sm text-center mb-8">ขณะนี้ลูกค้ารุม! ให้โฟกัสที่การคิดเงินหน้า POS หลัก<br/>เมื่อลูกค้าซาแล้ว ค่อยมากดนับยอดทีเดียวครับ</p>
            <button onClick={handleResumeRush} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl text-lg shadow-lg">✅ จบโหมดเร่งด่วน (ตรวจนับยอด)</button>
          </div>
        );
      }

      if (printViewData) {
        return (
          <>
            <style>{`
              @media print {
                html, body, #root { 
                  height: auto !important; 
                  overflow: visible !important; 
                  position: static !important; 
                  background-color: white !important; 
                }
              }
            `}</style>

            <div className="bg-white min-h-screen w-full p-4 md:p-8 font-sans text-slate-800 absolute inset-0 z-[999] overflow-y-auto print:static print:overflow-visible print:h-auto print:p-0">
              <div className="max-w-4xl mx-auto">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-end border-b-2 border-slate-200 pb-4 mb-6 print:hidden gap-4">
                    <div>
                        <h1 className="text-2xl md:text-3xl font-black text-slate-800">รายงานประวัติ POS Manager</h1>
                        <p className="text-sm md:text-base text-slate-500 mt-2">พิมพ์เมื่อ: {new Date().toLocaleString('th-TH')}</p>
                        <p className="text-sm md:text-base text-slate-500">จำนวนรายการ: {printViewData.length} รายการ</p>
                    </div>
                    <div className="flex w-full md:w-auto gap-2 md:gap-3">
                        <button onClick={() => setPrintViewData(null)} className="flex-1 md:flex-none px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold transition-colors">
                          ◀ กลับ
                        </button>
                        <button onClick={() => window.print()} className="flex-[2] md:flex-none px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md font-bold transition-colors flex justify-center items-center gap-2">
                          <span>🖨️</span> บันทึกเป็น PDF
                        </button>
                    </div>
                  </div>

                  <div className="hidden print:block mb-6 border-b border-slate-800 pb-4">
                      <h1 className="text-2xl font-black text-slate-800">รายงานประวัติ POS Manager</h1>
                      <p className="text-sm text-slate-500 mt-1">พิมพ์เมื่อ: {new Date().toLocaleString('th-TH')}</p>
                  </div>

                  <div className="space-y-4 print:space-y-3">
                    {Array.isArray(printViewData) && printViewData.map((l, i) => (
                        <div key={l.id || i} className="border-2 border-slate-100 rounded-xl p-4 md:p-5 bg-slate-50 shadow-sm print:shadow-none print:border-slate-300 print:break-inside-avoid">
                          <div className="flex justify-between items-start mb-4 print:mb-2">
                              <div className="flex-1 pr-2">
                                <span className="inline-block text-xs md:text-sm font-bold text-slate-500 bg-white px-2 py-1 rounded-md border border-slate-200 shadow-sm mr-2 mb-1 print:shadow-none">{l.time || '-'}</span>
                                <span className="font-bold text-slate-800 text-base md:text-lg">{l.msg || ''}</span>
                              </div>
                              <div className="text-right flex flex-col pl-2 shrink-0">
                                <span className={`text-sm md:text-base font-black ${l.diff > 0 ? 'text-emerald-600' : l.diff < 0 ? 'text-red-600' : 'text-slate-500'}`}>
                                    ส่วนต่าง: {l.diff > 0 ? '+' : ''}{formatCurr(l.diff || 0)}
                                </span>
                                <span className={`text-xs md:text-sm font-bold mt-1 ${l.totalVar > 0 ? 'text-blue-600' : l.totalVar < 0 ? 'text-orange-600' : 'text-slate-500'}`}>
                                    รวม: {l.totalVar > 0 ? '+' : ''}{formatCurr(l.totalVar || 0)}
                                </span>
                              </div>
                          </div>
                          <div className="text-xs md:text-sm text-slate-700 bg-white p-3 md:p-4 rounded-lg border border-slate-200 leading-relaxed print:shadow-none">
                              {Array.isArray(l.details) && l.details.length > 0 ? (
                                <div className="space-y-1 md:space-y-2">
                                    {l.details.map((dt, idx) => (
                                       <div key={idx} className="border-b border-slate-100 pb-1.5 last:border-0 last:pb-0">
                                          {typeof dt === 'object' && dt !== null && !React.isValidElement(dt) 
                                            ? <span className="text-orange-500 font-bold italic">⚠️ [ประวัติเก่าที่รวมยอดแล้ว]</span> 
                                            : formatLogDetail(dt)}
                                       </div>
                                    ))}
                                </div>
                              ) : (
                                <span className="text-slate-400 italic">ไม่มีรายละเอียด</span>
                              )}
                          </div>
                        </div>
                    ))}
                  </div>
                  
                  <div className="mt-8 text-center text-xs text-slate-400 border-t pt-4 pb-8 print:pb-0">สร้างโดย POS Cash Assistant</div>
              </div>
            </div>
          </>
        );
      }

      return (
        <div className="flex flex-col h-screen w-full max-w-lg mx-auto bg-slate-100 shadow-xl overflow-hidden relative">
          
          {showVarAlert && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] w-11/12 max-w-sm bg-white rounded-xl shadow-2xl border-l-8 border-red-500 animate-[slideDown_0.3s_ease-out] overflow-hidden">
                <div className="p-4 flex items-start gap-3">
                    <div className="text-3xl">{showVarAlert.totalVar > 0 ? '📈' : '📉'}</div>
                    <div className="flex-1">
                        <h3 className={`font-black text-lg ${showVarAlert.totalVar > 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                            {showVarAlert.totalVar > 0 ? 'ยอดเงินเกินระบบ!' : 'ยอดเงินขาดจากระบบ!'}
                        </h3>
                        <p className="text-xs text-slate-500 font-medium">
                            รายการล่าสุดทำให้เงิน {showVarAlert.diff > 0 ? 'เกินมา' : 'หายไป'} {Math.abs(showVarAlert.diff)} บาท
                        </p>
                        <div className={`mt-1 font-bold text-sm ${showVarAlert.totalVar > 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                            รวมส่วนต่างตอนนี้: {showVarAlert.totalVar > 0 ? '+' : ''}{showVarAlert.totalVar} บาท
                        </div>
                    </div>
                    <button onClick={() => setShowVarAlert(null)} className="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
                </div>
            </div>
          )}

          <div className="bg-slate-800 text-white p-3 flex justify-between items-center z-10 shrink-0">
            <div><h1 className="font-bold text-lg">💰 POS Manager</h1><p className="text-[10px] text-slate-300">ตัวช่วยจำเงินสด</p></div>
            <div className="flex items-center gap-2">
              <button onClick={handleRushClick} className="bg-amber-600 hover:bg-amber-500 px-2 py-1.5 rounded text-xs font-bold shadow border border-amber-600">⚡ Rush</button>
              <button onClick={handlePauseClick} className="bg-slate-600 hover:bg-slate-500 px-2 py-1.5 rounded text-xs font-bold shadow border border-slate-500">⏸️ พัก</button>
              <div className="text-right leading-tight ml-1"><div className="text-[10px] text-slate-400">รวมทั้งร้าน</div><div className="font-bold text-lg text-emerald-400">฿{formatCurr(grandTotal)}</div></div>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto pb-24" ref={scrollContainerRef} onScroll={handleScroll}>
            
            {activeTab === 'action' && (
              <div className="p-3 flex flex-col min-h-full">
                <div className="flex bg-white rounded-lg p-1 shadow-sm border border-slate-200 mb-2 shrink-0">
                  <button onClick={() => { setActivePos('pos1'); clearTransaction(); }} className={`flex-1 py-1.5 font-bold rounded-md text-sm ${activePos === 'pos1' ? 'bg-blue-600 text-white shadow' : 'text-slate-500'}`}>💻 POS 1</button>
                  <button onClick={() => { setActivePos('pos2'); clearTransaction(); }} className={`flex-1 py-1.5 font-bold rounded-md text-sm ${activePos === 'pos2' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500'}`}>💻 POS 2</button>
                </div>

                <div className="flex justify-between items-center mb-2 shrink-0">
                  <div className="text-sm font-bold text-slate-600">เก๊ะ {activePos.toUpperCase()}: <span className="text-blue-600 text-lg">฿{formatCurr(activePos === 'pos1' ? pos1Total : pos2Total)}</span></div>
                  <div className="flex gap-2 bg-slate-200 p-1 rounded-lg text-xs font-bold">
                    <button onClick={()=>setTxType('sales')} className={`px-2 py-1 rounded ${txType==='sales'?'bg-white text-slate-800 shadow':'text-slate-500'}`}>🛒 ขาย</button>
                    <button onClick={()=>setTxType('deposit')} className={`px-2 py-1 rounded ${txType==='deposit'?'bg-white text-slate-800 shadow':'text-slate-500'}`}>🏧 ฝาก</button>
                  </div>
                </div>

                <div className="flex gap-2 mb-2 shrink-0">
                  <button onClick={() => setActionMode('receive')} className={`flex-1 py-2 rounded-lg font-bold text-base transition-all ${actionMode === 'receive' ? 'bg-emerald-500 text-white shadow-md ring-2 ring-emerald-300' : 'bg-white text-slate-500 border border-slate-200'}`}>📥 รับเงินลูกค้า</button>
                  <button onClick={() => setActionMode('change')} className={`flex-1 py-2 rounded-lg font-bold text-base transition-all ${actionMode === 'change' ? 'bg-red-500 text-white shadow-md ring-2 ring-red-300' : 'bg-white text-slate-500 border border-slate-200'}`}>📤 หยิบทอน</button>
                </div>

                <div className="bg-slate-800 rounded-xl shadow-md p-3 mb-3 text-white shrink-0 border border-slate-700">
                  <div className="flex flex-col gap-1 mb-2">
                    <div className="flex justify-between items-start"><div className="text-sm text-emerald-400 font-bold">รับ: ฿{currentTx.receive}</div><div className="text-[10px] text-emerald-200 text-right w-2/3 break-words">{renderTxDetails(currentTxDetails.receive)}</div></div>
                    <div className="flex justify-between items-start"><div className="text-sm text-red-400 font-bold">ทอน: ฿{currentTx.change}</div><div className="text-[10px] text-red-200 text-right w-2/3 break-words">{renderTxDetails(currentTxDetails.change)}</div></div>
                  </div>
                  <div className="flex gap-2 mt-2 pt-2 border-t border-slate-600 items-center">
                    <div className="text-sm font-bold text-blue-300 flex-1">สุทธิ: ฿{currentTx.receive - currentTx.change}</div>
                    <button onClick={cancelTransaction} className="bg-slate-600 text-white px-3 py-1.5 rounded font-bold text-xs shadow active:scale-95">❌ คืนค่า</button>
                    <button onClick={clearTransaction} className="bg-emerald-500 text-white px-3 py-1.5 rounded font-bold text-xs shadow active:scale-95">✅ จบบิล</button>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2 flex-1 pb-2 content-start">
                  {denoms.map(d => {
                    const drawerData = activePos === 'pos1' ? pos1 : pos2;
                    const stashData = activePos === 'pos1' ? pos1Stash : pos2Stash;
                    return (
                      <button key={d} onPointerDown={(e) => handlePressStart(e, d)} onPointerUp={(e) => handlePressEnd(e, d)} onPointerLeave={(e) => { if(timerRef.current) clearTimeout(timerRef.current); }} onContextMenu={(e) => e.preventDefault()} style={{ touchAction: 'manipulation' }} className={`prevent-select btn-press rounded-lg h-14 flex flex-col justify-center items-center shadow-md transition-all ${getDenomColor(d)}`}>
                        <span className="font-bold text-lg leading-none mb-0.5">{d >= 1 ? d : `${d * 100} สต.`}</span>
                        <span className="text-[9px] opacity-90 font-medium">เศษใช้ทอน: {drawerData[d]} {stashData[d] > 0 && `(แยก${stashData[d]})`}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'count' && (
              <div className="p-3 space-y-3">
                {isPostBreak && (
                  <div className="bg-amber-100 border border-amber-300 rounded-lg p-3 shadow-sm mb-3">
                    <div className="text-sm text-amber-800 font-bold mb-2 flex items-center gap-1"><span>⚠️</span> โหมดตรวจนับยอดหลังพัก (รับลูกค้าได้ปกติ)</div>
                    <div className="flex justify-between text-xs text-amber-700 mb-1"><span>ยอดก่อนพักเครื่อง:</span> <span className="font-bold">฿{formatCurr(preBreakTotal)}</span></div>
                    <div className="flex justify-between text-xs text-amber-700 mb-2"><span>นับได้ตอนนี้ (รวมดราฟ):</span> <span className="font-bold">฿{formatCurr(grandTotal)}</span></div>
                    <div className="flex justify-between text-sm font-bold text-amber-900 mb-3 border-t border-amber-200 pt-2">
                      <span>เงินส่วนต่างที่เข้า/ออก:</span> <span className={(grandTotal - preBreakTotal) >= 0 ? 'text-emerald-600' : 'text-red-600'}>{(grandTotal - preBreakTotal) >= 0 ? '+' : ''}฿{formatCurr(grandTotal - preBreakTotal)}</span>
                    </div>
                    <button onClick={confirmPostBreakCount} className="w-full bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg font-bold text-sm shadow">✅ ยืนยันปรับปรุงยอดช่วงพัก</button>
                  </div>
                )}

                {/* [UI ใหม่] แบนเนอร์จบรอบ Rush Hour */}
                {isPostRush && (
                  <div className="bg-blue-100 border border-blue-300 rounded-lg p-3 shadow-sm mb-3">

                  if(window.confirm('⚠️ ต้องการล้างข้อมูลการนับทั้งหมดเพื่อเริ่มใหม่หรือไม่?')) {
                    setPos1({...defaultDrawer}); setPos2({...defaultDrawer}); setPos1Stash({...defaultDrawer}); setPos2Stash({...defaultDrawer});
                    setTidel({ t1_20:0, t2_20:0, t3_20:0, t4_100:0, t5_100:0, t6_100:0, t7_100:0, t8_100:0 }); setUnderMachine(''); setLogs([]); setCurrentTx({receive:0,change:0}); setCurrentTxDetails({receive:{},change:{}});
                    setBaseline(null); setSalesTotal(0); setDepositTotal(0); setBreakAdjustments(0); setRushHourSales(0); setMovements({ pos1: {...defaultDrawer}, pos2: {...defaultDrawer} }); setDraftedTotal(0); setVariances(defaultVariances); alert('ล้างข้อมูลเรียบร้อยแล้ว');
                  }
                }} className="w-full py-4 text-red-500 font-bold bg-white border border-red-200 rounded-xl shadow-sm">🗑️ ล้างข้อมูลรีเซ็ตทั้งหมด (Reset)</button>
              </div>
            )}
            

          </div>

          {showLongPressMenu && (
            <div className="fixed inset-0 bg-slate-900/60 z-[200] flex items-center justify-center p-4 animate-[slideDown_0.2s_ease-out]">
              <div className="bg-white rounded-2xl shadow-2xl p-5 w-full max-w-xs">
                <h3 className="font-bold text-lg mb-3 border-b border-slate-100 pb-2 text-slate-800 text-center">
                  จัดการ {longPressData.denom >= 1 ? `แบงก์/เหรียญ ${longPressData.denom}` : `เหรียญ ${longPressData.denom * 100} สต.`}
                </h3>
                
                {!showQtyInput ? (
                  <div className="space-y-2">
                    <button onClick={() => resetDenomTx(longPressData.denom)} className="w-full bg-red-50 text-red-600 hover:bg-red-100 font-bold py-3 rounded-xl border border-red-200 transition-colors">
                      ♻️ ล้างค่าปุ่มนี้ (ในบิลปัจจุบัน)
                    </button>
                    <button onClick={() => setShowQtyInput(true)} className="w-full bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold py-3 rounded-xl border border-blue-200 transition-colors">
                      ⌨️ พิมพ์ระบุจำนวนเอง
                    </button>
                    <button onClick={() => setShowLongPressMenu(false)} className="w-full bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold py-3 rounded-xl mt-2 transition-colors">
                      ❌ ปิดหน้าต่าง
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1 text-center">ระบุจำนวนที่ต้องการ (ใบ/ชิ้น)</label>
                      <input 
                        type="number" 
                        value={longPressData.qtyInput} 
                        onChange={(e) => setLongPressData(p => ({...p, qtyInput: e.target.value}))} 
                        className="w-full border-2 border-blue-300 focus:border-blue-500 outline-none p-3 rounded-xl text-center text-xl font-black text-slate-800" 
                        placeholder="0" 
                        autoFocus 
                      />
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => setShowLongPressMenu(false)} className="flex-1 bg-slate-200 text-slate-700 font-bold py-3 rounded-xl">ยกเลิก</button>
                      <button onClick={() => applyDenomQty(longPressData.denom, parseInt(longPressData.qtyInput) || 0)} className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">✅ ยืนยัน</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="bg-white border-t border-slate-200 fixed bottom-0 w-full max-w-lg mx-auto flex justify-around pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50">
            <button onClick={() => setActiveTab('action')} className={`flex-1 flex flex-col items-center py-2 text-[10px] font-bold ${activeTab === 'action' ? 'text-blue-600' : 'text-slate-400'}`}><span className="text-xl mb-0.5">🛒</span>รับ/ทอน</button>
            <button onClick={() => setActiveTab('count')} className={`flex-1 flex flex-col items-center py-2 text-[10px] font-bold ${activeTab === 'count' ? 'text-emerald-600' : 'text-slate-400'}`}><span className="text-xl mb-0.5">🧮</span>นับเงิน</button>
            <button onClick={() => setActiveTab('exchange')} className={`flex-1 flex flex-col items-center py-2 text-[10px] font-bold ${activeTab === 'exchange' ? 'text-amber-600' : 'text-slate-400'}`}><span className="text-xl mb-0.5">🔄</span>โอน/แลก</button>
            <button onClick={() => setActiveTab('summary')} className={`flex-1 flex flex-col items-center py-2 text-[10px] font-bold ${activeTab === 'summary' ? 'text-purple-600' : 'text-slate-400'}`}><span className="text-xl mb-0.5">📊</span>สรุปผล</button>
            <button onClick={() => setActiveTab('sync')} className={`flex-1 flex flex-col items-center py-2 text-[10px] font-bold ${activeTab === 'sync' ? 'text-indigo-600' : 'text-slate-400'}`}><span className="text-xl mb-0.5">⚙️</span>ตั้งค่า</button>
          </div>
          <style>{`.pb-safe { padding-bottom: env(safe-area-inset-bottom); }`}</style>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<POSCashTracker />);
  </script>
</body>
</html>
